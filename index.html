<style>
:root{--paper:#EDF0EE;--card:#fff;--ink:#16262A;--mute:#5B6B6E;--line:#D3DAD6;--deep:#12453F;--deep2:#0C332E;--gold:#E8A317;--ok:#2E7D4F;--bad:#B23A2E;--warn:#9A6A0E;--tint:#F3F6F4}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.5 "Segoe UI",Tahoma,"Noto Sans Arabic","Noto Sans",system-ui,sans-serif}
h1,h2,h3{font-family:Georgia,"Iowan Old Style","Times New Roman",serif;font-weight:600;margin:0}
h1{font-size:24px}h2{font-size:18px}h3{font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--deep)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.mute{color:var(--mute)}
.btn{border:1px solid var(--line);background:#fff;padding:7px 12px;border-radius:4px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--deep)}
.btn.pri{background:var(--deep);border-color:var(--deep);color:#fff}
.btn.pri:hover{background:var(--deep2)}
.btn.bad{color:var(--bad)}
.btn.sm{padding:3px 8px;font-size:12px}
.lnk{background:none;border:0;padding:2px 6px;color:var(--deep);cursor:pointer;text-decoration:underline;font-size:13px}
.lnk.bad{color:var(--bad)}
input,select,textarea{border:1px solid var(--line);background:#fff;border-radius:4px;padding:7px 9px;width:100%;min-width:0}
textarea{min-height:70px;resize:vertical}
input[type=checkbox],input[type=radio]{width:auto}
label>span{display:block;font-size:12.5px;color:var(--mute);margin-bottom:3px}
/* layout */
.app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
.side{background:var(--deep);color:#d5e3df;position:sticky;top:0;height:100vh;overflow:auto;padding-bottom:20px}
.brand{padding:18px 18px 12px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:6px}
.brand b{font:600 18px Georgia,serif;color:#fff;display:block}
.brand small{color:#9db8b1}
.ng{padding:12px 18px 3px;font-size:12px;color:#8fb0a8}
.nav a{display:block;padding:7px 18px;border-left:3px solid transparent;color:inherit;text-decoration:none;cursor:pointer}
.nav a:hover{background:rgba(255,255,255,.07)}
.nav a.on{border-left-color:var(--gold);background:var(--deep2);color:#fff}
.main{min-width:0}
.top{display:flex;align-items:center;gap:12px;padding:10px 24px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top .sp{flex:1}
.burger{display:none}
.who{font-size:13px;text-align:right;line-height:1.3}
.content{padding:22px 24px 60px;max-width:1300px}
.banner{background:#FFF4D6;border-bottom:1px solid #E8CE86;padding:8px 24px;font-size:13px;display:flex;gap:12px;align-items:center}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tools .search{width:210px}.tools select{width:auto;max-width:200px}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:16px}
.card.flush{padding:0}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-weight:600;font-size:12.5px;color:var(--mute);background:var(--tint);white-space:nowrap}
td.num,th.num{text-align:right}
tbody tr:hover{background:#FAFBFA}
td.acts{white-space:nowrap;text-align:right}
tfoot td{font-weight:600;background:var(--tint)}
.empty{padding:40px 16px;text-align:center;color:var(--mute)}
.empty b{display:block;color:var(--ink);font:600 16px Georgia,serif;margin-bottom:4px}
.tag{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;background:#E5ECE8;color:#264;white-space:nowrap}
.tag.ok{background:#DCEFE3;color:var(--ok)}.tag.bad{background:#F6DDD9;color:var(--bad)}.tag.warn{background:#F8EBCB;color:var(--warn)}
.two{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px}
.led{display:flex;align-items:baseline;gap:8px;padding:6px 0}
.led i{flex:1;border-bottom:2px dotted #B9C5BF;transform:translateY(-3px)}
.led b{font:600 18px Georgia,serif}
.led.big b{font-size:22px}
.note{padding:10px 12px;border-left:3px solid var(--gold);background:#FFF9E8;margin:10px 0;font-size:13px}
.bar{height:8px;background:#E5ECE8;border-radius:4px;overflow:hidden}.bar>div{height:100%;background:var(--deep)}
/* forms and modals */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.grid .full{grid-column:1/-1}
.ov{position:fixed;inset:0;background:rgba(10,25,22,.5);z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:30px 12px}
.modal{background:#fff;border-radius:6px;width:100%;max-width:520px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.modal.wide{max-width:860px}
.mh{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.x{background:none;border:0;font-size:24px;line-height:1;cursor:pointer;color:var(--mute)}
.mb{padding:18px}.mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.toasts{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:99;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:var(--ink);color:#fff;padding:9px 16px;border-radius:4px;font-size:13px;max-width:92vw}
.toast.bad{background:var(--bad)}.toast.ok{background:var(--ok)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.subjgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}.subjchk{display:flex;align-items:center;gap:9px;margin:0;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;cursor:pointer}.subjchk input{width:18px;height:18px;margin:0;accent-color:var(--deep)}.subjchk span{font-size:14px;color:var(--ink)}.subjchk:has(input:checked){border-color:var(--deep);background:rgba(18,69,63,.06)}
.seg label{margin:0;cursor:pointer}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:block;margin:0;padding:4px 11px;font-size:13px;color:var(--ink);border-right:1px solid var(--line);background:#fff}
.seg label:last-child span{border-right:0}
.seg input:checked+span{background:var(--deep);color:#fff}
.seg input.a:checked+span{background:var(--bad)}
.seg input.l:checked+span{background:var(--warn)}
.seg input:focus-visible+span{outline:2px solid var(--gold)}
.perm td,.perm th{padding:4px 8px;font-size:13px}.perm td:first-child{white-space:nowrap}
.perm td+td,.perm th+th{text-align:center}
/* chat */
.chat{display:grid;grid-template-columns:230px 1fr;gap:0;min-height:480px}
.clist{border-right:1px solid var(--line);overflow:auto;max-height:560px}
.clist a{display:block;padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer;text-decoration:none;color:inherit}
.clist a.on{background:var(--tint);border-left:3px solid var(--gold)}
.msgs{display:flex;flex-direction:column;gap:8px;padding:14px;overflow:auto;height:420px;background:#F7F9F8}
.m{max-width:75%;padding:7px 11px;border-radius:8px;background:#fff;border:1px solid var(--line);align-self:flex-start;word-break:break-word}
.m.me{align-self:flex-end;background:#DDEBE6;border-color:#C2D8D0}
.m small{display:block;color:var(--mute);font-size:11px;margin-top:2px}
.m img{max-width:240px;border-radius:4px;display:block}
.cmp{display:flex;gap:6px;padding:10px;border-top:1px solid var(--line);flex-wrap:wrap}
.cmp input[type=text]{flex:1;min-width:150px}
/* auth */
.auth{display:grid;grid-template-columns:1.05fr 1fr;min-height:100vh}
.auth .l{background:var(--deep) repeating-linear-gradient(180deg,transparent 0 33px,rgba(255,255,255,.07) 33px 34px);color:#fff;padding:56px 48px;display:flex;flex-direction:column;justify-content:center;gap:18px;border-right:6px solid var(--gold)}
.auth .l h1{font-size:40px;line-height:1.15;max-width:420px}
.auth .l p{max-width:420px;color:#cfe1dc;margin:0}
.auth .r{display:flex;align-items:center;justify-content:center;padding:30px 16px;background:#fff}
.auth form{width:100%;max-width:400px;display:grid;gap:12px}
.tabs{display:flex;gap:18px;border-bottom:1px solid var(--line);margin-bottom:6px}
.tabs a{padding:8px 0;cursor:pointer;color:var(--mute);border-bottom:2px solid transparent;text-decoration:none}
.tabs a.on{color:var(--ink);border-bottom-color:var(--deep);font-weight:600}
.err{color:var(--bad);font-size:13px;min-height:18px}
/* documents */
.ov.doc{background:#6b7a76;padding:0;display:block}
.docbar{position:sticky;top:0;background:#fff;padding:10px 16px;display:flex;gap:8px;justify-content:center;border-bottom:1px solid var(--line);z-index:2}
.sheet{background:#fff;width:100%;max-width:820px;margin:18px auto;padding:32px;box-shadow:0 4px 18px rgba(0,0,0,.25)}
@media print{#root,.ov:not(.doc),.toasts{display:none!important}.ov.doc{position:static;background:#fff;padding:0;overflow:visible}.docbar{display:none}.sheet{box-shadow:none;margin:0;max-width:none;padding:0}body{background:#fff}}
@media(max-width:860px){
 .app{grid-template-columns:1fr}
 .side{position:fixed;left:0;top:0;bottom:0;width:250px;z-index:40;transform:translateX(-100%);transition:transform .2s}
 .side.open{transform:none}
 .burger{display:inline-block}
 .top,.content,.banner{padding-left:14px;padding-right:14px}
 .two,.chat,.auth{grid-template-columns:1fr}
 .auth .l{padding:28px 22px;border-right:0;border-bottom:6px solid var(--gold)}.auth .l h1{font-size:28px}
 .clist{max-height:150px;border-right:0;border-bottom:1px solid var(--line)}
 .tools .search{width:100%}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

:root{--deep:#0E3B43;--deep2:#082A31;--gold:#D49A1F;--paper:#F0F3F4;--line:#DCE2E4;--tint:#F5F7F8;--r:10px;--sh:0 1px 2px rgba(16,40,46,.06),0 8px 22px rgba(16,40,46,.06)}
body{font-family:"Segoe UI Variable","Segoe UI",Inter,system-ui,sans-serif}
h1,h2,h3,.brand b,.empty b,.led b,.auth .l h1{font-family:inherit;font-weight:650;letter-spacing:-.015em}
h1{font-size:27px}.auth .l h1{font-size:44px;line-height:1.1}
.card,.modal,.btn,input,select,textarea,.seg,.note{border-radius:var(--r)}
.card{box-shadow:var(--sh);border-color:#E2E7E9;padding:20px}.card.flush{padding:0;overflow:hidden}
.btn{padding:8px 15px;font-weight:550;transition:.15s}.btn:hover{box-shadow:0 2px 8px rgba(16,40,46,.1)}
.btn.sm{padding:4px 10px;border-radius:8px}
.btn.pri{background:linear-gradient(180deg,#16535D,var(--deep));box-shadow:0 1px 2px rgba(8,42,49,.35)}
input:focus,select:focus,textarea:focus{outline:2px solid rgba(212,154,31,.4);border-color:var(--gold)}
.side{background:linear-gradient(190deg,#11454E,#082A31 70%)}
.brand{padding:24px 20px 18px}.brand small{display:block;margin-top:3px;color:#9fc0c4}

.dkt:nth-child(2){animation-delay:.07s}.dkt:nth-child(3){animation-delay:.14s}.dkt:nth-child(4){animation-delay:.21s}.dkt:nth-child(n+5){animation-delay:.28s}
.dkr{animation:dkRing 1s cubic-bezier(.2,.8,.2,1) both}
.spsvg .ln{stroke-dasharray:1;stroke-dashoffset:1;animation:dkDraw 1.6s ease-out .15s forwards}
.spsvg .ar{animation:dkFade 1.4s ease-out .4s both}
.spsvg circle{animation:dkPop .4s ease-out 1.2s both;transform-box:fill-box;transform-origin:center}
.spsvg .bar{transform-box:fill-box;transform-origin:bottom;animation:dkGrow .9s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*70ms + 150ms)}
.dhb .tr i{transform-origin:left;animation:dkX 1s cubic-bezier(.2,.8,.2,1) .2s both}
@keyframes dkIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes dkRing{from{opacity:0;transform:rotate(-140deg) scale(.6)}to{opacity:1;transform:none}}
@keyframes dkDraw{to{stroke-dashoffset:0}}
@keyframes dkFade{from{opacity:0}to{opacity:.14}}
@keyframes dkPop{from{opacity:0;transform:scale(0)}to{opacity:1;transform:scale(1)}}
@keyframes dkGrow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes dkX{from{transform:scaleX(0)}to{transform:scaleX(1)}}
}

'use strict';
/* ============ utils ============ */
const $=(s,e=document)=>e.querySelector(s);
const $$=(s,e=document)=>[...e.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const pad=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const thisMonth=()=>today().slice(0,7);
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmtD=d=>{if(!d)return '';const [y,m,dd]=String(d).slice(0,10).split('-');return `${dd} ${MON[+m-1]||''} ${y}`};
const fmtM=m=>{if(!m)return '';const [y,mm]=m.split('-');return `${MON[+mm-1]||''} ${y}`};
const num=n=>(Number(n)||0).toLocaleString('en-US');
const hash=s=>{s='sms:'+s;let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0,c;i<s.length;i++){c=s.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return (4294967296*(2097151&h2)+(h1>>>0)).toString(36)};
function toast(m,t){const el=document.createElement('div');el.className='toast '+(t||'');el.textContent=m;$('#toasts').appendChild(el);setTimeout(()=>el.remove(),3400)}
function download(name,data,type){
  const blob=new Blob([data],{type});
  const C=window.Capacitor;
  if(C&&C.isNativePlatform&&C.isNativePlatform()&&C.Plugins&&C.Plugins.Filesystem&&C.Plugins.Share){
    const fr=new FileReader();
    fr.onload=async()=>{try{
      const b64=String(fr.result).split(',')[1]||'';
      const r=await C.Plugins.Filesystem.writeFile({path:name,data:b64,directory:'CACHE'});
      await C.Plugins.Share.share({title:name,url:r.uri,dialogTitle:'Save or share '+name});
    }catch(e){if(!/cancel/i.test(String(e&&e.message||e)))toast('Could not save the file: '+(e&&e.message||e),'bad')}};
    fr.readAsDataURL(blob);return;
  }
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();
}
function csvDownload(name,head,body){const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';download(name,'\ufeff'+[head,...body].map(r=>r.map(q).join(',')).join('\r\n'),'text/csv')}
const strip=h=>String(h).replace(/<[^>]+>/g,'').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'").trim();

/* ============ storage ============ */
const COLS=['tdefs','students','teachers','classes','subjects','att','tatt','fees','salaries','schedule','timetable','examtt','results','tests','withdrawals','certificates','income','expenses','notices','messages','homework','wa','subjcat','unotes','hwcheck'];
let DB;
const blank=()=>{const c={};COLS.forEach(k=>c[k]=[]);return{schools:[],users:[],seq:0,c}};
async function load(){
  let raw=null;
  try{if(window.storage){const r=await window.storage.get('sms-db');raw=r&&r.value}else if(typeof localStorage!=='undefined'){raw=localStorage.getItem('sms-db')}}catch(e){}
  try{DB=raw?JSON.parse(raw):blank()}catch(e){DB=blank()}
  DB.c=DB.c||{};COLS.forEach(k=>DB.c[k]=DB.c[k]||[]);DB.schools=DB.schools||[];DB.users=DB.users||[];DB.seq=DB.seq||0;
  {const gone=s=>{if(!s.pendingDelete)return false;const d=new Date(s.pendingDelete);d.setMonth(d.getMonth()+6);return Date.now()>d.getTime()};
   DB.schools.filter(gone).forEach(s=>{COLS.forEach(k=>DB.c[k]=DB.c[k].filter(r=>r.sid!==s.id));DB.users=DB.users.filter(u=>u.sid!==s.id)});DB.schools=DB.schools.filter(s=>!gone(s))}
  if(!DB.users.some(u=>u.role==='master'))DB.users.push({id:uid(),role:'master',name:'Master Admin',username:'master',pass:hash('master123'),active:true,sid:null});
}
let _t;
function CP(u,p){if(u.role!=='master'&&u.role!=='admin')u.initPw=p;else delete u.initPw}
function save(){clearTimeout(_t);_t=setTimeout(async()=>{const s=JSON.stringify(DB);try{if(window.storage)await window.storage.set('sms-db',s);else if(typeof localStorage!=='undefined')localStorage.setItem('sms-db',s)}catch(e){}},250)}

function can(mod,act='view'){
  const u=S.user;if(!u)return false;
  if(u.role==='master'||u.role==='admin')return true;
  if(u.role==='student'){if(u.permSet)return !!(u.perms&&u.perms[mod]&&u.perms[mod][act]);return (STUDENT_CAN[mod]||[]).includes(act)}
  if(u.role==='teacher'&&!u.permSet&&((mod==='tattendance'&&act==='view')||(mod==='teachers'&&act==='view')||(mod==='salaries'&&(act==='view'||act==='print'))))return true;
  return !!(u.perms&&u.perms[mod]&&u.perms[mod][act]);
}
function presetPerms(name){
  const all=(...m)=>{const o={};m.forEach(x=>o[x]=[...ACTS]);return o};
  const v=(...m)=>{const o={};m.forEach(x=>o[x]=['view']);return o};
  const P={
   Teacher:{...v('dashboard','students','classes','subjects','timetable','examtt','schedule','notices','ai'),homework:['view','create','edit','delete','print'],tests:['view','create','edit','delete','print'],results:['view','create','edit','print'],attendance:['view','create','edit'],communication:['view','create']},
   Accountant:{...v('dashboard','students','teachers','notices'),...all('fees','salaries','income','expenses'),reports:['view','print','export'],communication:['view','create']},
   Clerk:{...v('dashboard','classes','subjects','teachers','notices'),students:['view','create','edit','print','export'],withdrawals:['view','create','edit','print'],certificates:['view','create','edit','print'],attendance:['view','create','edit'],communication:['view','create']},
   'Read-only':v(...MS.filter(x=>!['users','settings','backup','communication'].includes(x)))
  };
  const out={};Object.entries(P[name]||{}).forEach(([m,a])=>{out[m]={};a.forEach(x=>out[m][x]=true)});return out;
}
function nextNo(prefix,col,field='no'){
  const re=new RegExp('^'+prefix+'-(\\d+)$');let max=0;
  rows(col).forEach(r=>{const m=re.exec(r[field]||'');if(m)max=Math.max(max,+m[1])});
  return prefix+'-'+String(max+1).padStart(4,'0');
}
function grade(p){return p>=90?'A+':p>=80?'A':p>=70?'B':p>=60?'C':p>=50?'D':p>=40?'E':'F'}
function makeRegId(name){
  const ini=(name.trim().split(/\s+/).map(w=>[...w][0]||'').join('').toUpperCase().replace(/[^\p{L}\p{N}]/gu,''))||'SCH';
  const d=today().replace(/-/g,'');let id;
  do{DB.seq++;id=ini+d+String(DB.seq).padStart(4,'0')}while(DB.schools.some(s=>s.regId===id));
  return id;
}
const WA_DEFAULT='Assalam-o-Alaikum. Your son/daughter {student} ({class}) was absent from school today ({date}). Please let us know if there is any problem. Thank you. - {school}';
function registerSchool(d){
  const sid=uid();
  const sch={id:sid,regId:makeRegId(d.name),name:d.name.trim(),address:d.address||'',phone:d.phone||'',email:d.email||'',created:today(),active:true,settings:{currency:d.currency||'AFN',currencyCountry:d.currencyCountry||'',countryCode:'93',pass:40,waTemplate:WA_DEFAULT,principal:''}};
  DB.schools.push(sch);
  DB.users.push({id:uid(),sid,role:'admin',name:d.admin,username:d.username.trim(),pass:hash(d.password),phone:d.phone||'',active:true});
  save();return sch;
}
/* ---- registration numbers, roll numbers and usernames ---- */
const schoolCode=()=>{const s=curSchool();return (((s&&s.regId||'').match(/^\D+/)||['SCH'])[0]).toUpperCase()};
function nextRegNo(prefix,col,field){
  const re=new RegExp('^'+prefix+'-(\\d+)');let max=0;
  rows(col).forEach(r=>{const m=re.exec(r[field]||'');if(m)max=Math.max(max,+m[1])});
  const code=schoolCode();let n=max+1,id;
  do{id=prefix+'-'+String(n).padStart(3,'0')+code;n++}while(rows(col).some(r=>String(r[field]||'').toUpperCase()===id));
  return id;
}
const WORDNO={first:1,second:2,third:3,fourth:4,fifth:5,sixth:6,seventh:7,eighth:8,ninth:9,tenth:10,eleventh:11,twelfth:12,one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10};
function classNo(classId){
  const c=byId('classes',classId);if(!c)return 0;
  const nm=String(c.name||'').toLowerCase(),d=/(\d+)/.exec(nm);if(d)return +d[1];
  const w=nm.split(/[^a-z]+/).find(x=>WORDNO[x]);return w?WORDNO[w]:0;
}
/* Roll no. is class wise: 1st -> STD-0001, 2nd -> STD-2001 ... 9th -> STD-9001, 10th -> STD-1001. Counted separately inside each class. */
function nextRollNo(classId){
  const n=classNo(classId);
  const p=n===1?'0':n?String(n):'X',w=n>=10?2:3;
  const re=new RegExp('^STD-'+p+'(\\d{'+w+',})$');let max=0;
  rows('students').forEach(s=>{if(s.classId!==classId)return;const m=re.exec(s.rollNo||'');if(m)max=Math.max(max,+m[1])});
  let k=max+1,id;
  do{id='STD-'+p+String(k).padStart(w,'0');k++}while(rows('students').some(s=>s.classId===classId&&s.rollNo===id));
  return id;
}
function makeAccount(role,rec,opt={}){
  const suf=role==='student'?'STD':'TCH',fb=role==='student'?'STUDENT':'TEACHER';
  const nm=(String(rec.name||'').trim().split(/\s+/)[0]||'').toUpperCase().replace(/[^A-Z0-9]/g,'')||fb;
  const re=new RegExp('(\\d+)-'+suf+'$','i');let max=0;
  DB.users.forEach(u=>{if(u.sid!==S.sid||u.role!==role)return;const m=re.exec(u.username||'');if(m)max=Math.max(max,+m[1])});
  let k=max+1,un;
  do{un=nm+String(k).padStart(4,'0')+'-'+suf;k++}while(DB.users.some(u=>String(u.username).toLowerCase()===un.toLowerCase()));
  const pw=opt.pw||String(Math.floor(100000+Math.random()*900000));
  DB.users.push({id:uid(),sid:S.sid,role,name:rec.name,username:un,pass:hash(pw),initPw:pw,phone:rec.phone||'',ref:rec.id,active:true,...roleDefaults(role)});
  save();return {username:un,password:pw};
}

}

/* ============ modal / confirm / docs ============ */
function openModal({title,html,save,saveLabel='Save',wide,foot=true}){
  const el=document.createElement('div');el.className='ov';
  el.innerHTML=`<div class="modal ${wide?'wide':''}" role="dialog" aria-label="${esc(title)}"><div class="mh"><h2>${title}</h2><button class="x" data-m="x" aria-label="Close">&times;</button></div><div class="mb">${html}</div>${foot?`<div class="mf"><button class="btn" data-m="x">${save?'Cancel':'Close'}</button>${save?`<button class="btn pri" data-m="ok">${saveLabel}</button>`:''}</div>`:''}</div>`;
  document.body.appendChild(el);
  const close=()=>el.remove();
  el.addEventListener('click',e=>{const t=e.target.closest('[data-m]');if(!t)return;if(t.dataset.m==='x')close();else if(t.dataset.m==='ok')save(close,el)});
  const f=el.querySelector('form');if(f)f.addEventListener('submit',e=>{e.preventDefault();save&&save(close,el)});
  return {el,close};
}
function ask(msg,label='Confirm'){
  return new Promise(res=>{let done=false;
    const m=openModal({title:'Please confirm',html:`<p>${esc(msg)}</p>`,saveLabel:label,save:c=>{done=true;c();res(true)}});
    m.el.addEventListener('click',e=>{if(e.target.closest('[data-m="x"]')&&!done){done=true;res(false)}});

/* ============ generic CRUD engine ============ */
function opts(f){
  if(f.t==='select')return (typeof f.o==='function'?f.o():f.o).map(o=>Array.isArray(o)?o:[o,o]);
  let L=rows(f.ref);if(f.filter&&!f.all)L=L.filter(f.filter);
  return L.map(r=>[r.id,LBL[f.ref](r)]).sort((a,b)=>a[1].localeCompare(b[1]));
}
function inp(f,v){
  const n=`name="${f.k}"`,rq=f.req?'required':'';
  if(f.t==='select'||f.t==='ref'){
    let o=opts(f);
    if(v&&f.t==='ref'&&!o.some(x=>x[0]===v)){const r=byId(f.ref,v);if(r)o.unshift([r.id,LBL[f.ref](r)])}
    return `<select ${n} ${rq}><option value=""></option>${o.map(([a,b])=>`<option value="${esc(a)}" ${a===v?'selected':''}>${esc(b)}</option>`).join('')}</select>`;
  }
  if(f.t==='textarea')return `<textarea ${n} ${rq}>${esc(v)}</textarea>`;
  return `<input ${n} type="${f.t||'text'}" ${f.t==='number'?'step="any" min="0"':''} value="${esc(v==null?'':v)}" ${rq}>`;
}
function defVal(f){return typeof f.def==='function'?f.def():f.def}
function openForm(key,id){
  const m=M[key],old=id?byId(m.col,id):null,isNew=!old;
  const fl=m.fields.filter(f=>!(f.ctx==='create'&&!isNew)&&!(f.ctx==='edit'&&isNew)&&!(m.hideFor&&m.hideFor(f)));
  const html='<form class="grid">'+fl.map(f=>`<label class="${f.t==='textarea'?'full':''}"><span>${f.l}${f.req?' *':''}</span>${inp(f,old?old[f.k]:defVal(f))}</label>`).join('')+'</form>';
  openModal({title:(isNew?(m.add||'Add'):'Edit '+(m.title.toLowerCase())),html,wide:fl.length>6,save:(close,el)=>{
    const form=el.querySelector('form');if(!form.reportValidity())return;
    const raw=Object.fromEntries(new FormData(form));
    const rec=old?{...old}:{id:uid(),sid:S.sid,ts:Date.now()};
    fl.forEach(f=>{rec[f.k]=f.t==='number'?(raw[f.k]===''||raw[f.k]==null?0:Number(raw[f.k])):(raw[f.k]==null?'':raw[f.k])});
    const err=m.before&&m.before(rec,isNew,old);if(err){toast(err,'bad');return}
    let target=rec;if(old){Object.assign(old,rec);target=old}else DB.c[m.col].push(rec);
    save();close();if(m.after)m.after(target,isNew);render();toast(isNew?'Saved.':'Changes saved.','ok');
  }});
}
function cellHTML(m,r,c){
  if(m.render&&m.render[c])return m.render[c](r);
  const f=m.fields.find(x=>x.k===c);
  if(f){const v=r[c];
    if(f.t==='ref')return esc(refText(f.ref,v));
    if(f.t==='date')return esc(fmtD(v));
    if(f.t==='month')return esc(fmtM(v));
    if(f.t==='number')return esc(num(v));
    return esc(v);}
  return esc(r[c]);
}
const colLabel=(m,c)=>(m.labels&&m.labels[c])||(m.fields.find(f=>f.k===c)||{}).l||c;
function listFor(key){
  const m=M[key];let L=scope(key,rows(m.col));if(m.ymk)L=L.filter(r=>ymFilter(m.ymk,(r[m.ymf||'month']||'')+'-01'));
  const f=S.f[key];if(f&&m.filter)L=L.filter(r=>(m.classOf?m.classOf(r):r[m.filter])===f);if(m.extraFilter)L=L.filter(m.extraFilter);
  const q=S.q[key];if(q)L=L.filter(r=>m.cols.map(c=>strip(cellHTML(m,r,c))).join(' ').toLowerCase().includes(q));
  return m.sort?[...L].sort(m.sort):[...L].reverse();
}
function tableHTML(key){
  const m=M[key],L=listFor(key);
  if(!L.length)return `<div class="empty"><b>No ${m.title.toLowerCase()} found</b>${can(key,'create')&&!m.noAdd?`Use “${m.add||'Add'}” to create the first record.`:(m.tools&&can(key,'create')?`Use “${m.tools[0].l}” to add records.`:'Nothing to show yet.')}</div>`;
  const nc=c=>(m.numCols||[]).includes(c)?' class="num"':'';
  const th=m.cols.map(c=>`<th${nc(c)}>${esc(colLabel(m,c))}</th>`).join('')+'<th></th>';
  const body=L.map(r=>{
    const a=[];
    (m.rowActs||[]).forEach(x=>{if(x.can(r))a.push(`<button class="lnk" data-a="row" data-k="${key}" data-id="${r.id}" data-t="${x.a}">${x.l}</button>`)});
    if(m.doc&&can(key,'print'))a.push(`<button class="lnk" data-a="print" data-k="${key}" data-id="${r.id}">${m.print||'Print'}</button>`);
    if(can(key,'edit')&&!m.noEdit&&(!m.editable||m.editable(r)))a.push(`<button class="lnk" data-a="edit" data-k="${key}" data-id="${r.id}">Edit</button>`);
    if(can(key,'delete')&&(!m.deletable||m.deletable(r)))a.push(`<button class="lnk bad" data-a="del" data-k="${key}" data-id="${r.id}">Delete</button>`);
    return `<tr>${m.cols.map(c=>`<td${nc(c)}>${cellHTML(m,r,c)}</td>`).join('')}<td class="acts">${a.join('')}</td></tr>`;
  }).join('');
  return `<div class="tw"><table><thead><tr>${th}</tr></thead><tbody>${body}</tbody>${m.foot?`<tfoot>${m.foot(L)}</tfoot>`:''}</table></div><div class="mute" style="padding:8px 12px;font-size:12.5px">${L.length} record${L.length>1?'s':''}</div>`;
}
function crudPage(key){
  const m=M[key];let h=`<div class="head"><h1>${m.title}</h1><div class="tools"><input class="search" type="search" placeholder="Search" aria-label="Search" data-i="q" data-k="${key}" value="${esc(S.q[key]||'')}">`;
  if(m.filter){const f=m.fields.find(x=>x.k===m.filter);h+=`<select aria-label="Filter" data-i="f" data-k="${key}"><option value="">All classes</option>${opts({t:'ref',ref:'classes'}).map(([a,b])=>`<option value="${a}" ${S.f[key]===a?'selected':''}>${esc(b)}</option>`).join('')}</select>`}
  (m.tools||[]).forEach(t=>{if(can(key,t.p||'create'))h+=`<button class="btn ${t.cls||''}" data-a="tool" data-k="${key}" data-t="${t.a}">${t.l}</button>`});
  if(can(key,'export'))h+=`<button class="btn" data-a="export" data-k="${key}">Export CSV</button>`;
  if(can(key,'create')&&!m.noAdd)h+=`<button class="btn pri" data-a="add" data-k="${key}">${m.add||'Add'}</button>`;
  h+=`</div></div>${m.top?`<div id="top">${m.top()}</div>`:''}<div class="card flush" id="tbl">${tableHTML(key)}</div>`;
  return h;
}
function scope(col,list){
  const u=S.user;
  if(u.role==='student'){
    const me=byId('students',u.ref)||{};
    if(col==='students')return list.filter(r=>r.id===u.ref);
    if(col==='classes')return list.filter(r=>r.id===me.classId);
    return list.filter(r=>'studentId' in r?r.studentId===u.ref:('classId' in r?r.classId===me.classId:true));
  }
  if(u.role==='teacher'){if(col==='teachers')return list.filter(r=>r.id===u.ref);if(col==='salaries')return list.filter(r=>r.teacherId===u.ref)}
  if(col==='notices'&&!isAdm()){const a={staff:'Staff',teacher:'Teachers'}[u.role];return list.filter(r=>r.audience==='All'||r.audience===a)}
  return list;
}

function payFeeDialog(fee){if(fbal(fee)<=0){toast('This fee is already paid. It cannot be paid again.','bad');return}if(S.user.role==='student')return bankDialog(fee);

function dmcDocs(exam,classId,ids){
  const all=rows('results').filter(r=>r.exam===exam&&r.classId===classId);
  const tot={};all.forEach(r=>tot[r.studentId]=(tot[r.studentId]||0)+r.obtained);

  return ids.map(sid=>{
    const s=byId('students',sid);if(!s)return '';
    const rs=all.filter(r=>r.studentId===sid);if(!rs.length)return '';
    const T=rs.reduce((a,r)=>a+r.total,0),O=rs.reduce((a,r)=>a+r.obtained,0),P=pct(O,T),pm=cfg().pass;
    const pass=rs.every(r=>pct(r.obtained,r.total)>=pm);
    return `<div class="pb">${docHead()}<h2>Detailed Marks Certificate (DMC) - ${esc(exam)}</h2><table class="kv"><tr><td>Student</td><td>${esc(s.name)}</td><td>Admission no.</td><td>${esc(s.regNo)}</td></tr><tr><td>Father's name</td><td>${esc(s.fatherName)}</td><td>Class</td><td>${esc(refText('classes',s.classId))}</td></tr></table><table><thead><tr><th>Subject</th><th class="r">Total</th><th class="r">Obtained</th><th class="r">%</th><th>Grade</th></tr></thead><tbody>${[...rows('subjects').filter(x=>x.classId===classId).map(x=>rs.find(r=>r.subjectId===x.id)||{subjectId:x.id,none:1}),...rs.filter(r=>!rows('subjects').some(x=>x.id===r.subjectId))].map(r=>{if(r.none)return `<tr><td>${esc(refText('subjects',r.subjectId))}</td><td class="r">-</td><td class="r">-</td><td class="r">-</td><td>-</td></tr>`;const p=pct(r.obtained,r.total);return `<tr><td>${esc(refText('subjects',r.subjectId))}</td><td class="r">${r.total}</td><td class="r">${r.obtained}</td><td class="r">${p}</td><td>${grade(p)}</td></tr>`}).join('')}</tbody><tfoot><tr><th>Grand total</th><th class="r">${T}</th><th class="r">${O}</th><th class="r">${P}</th><th>${grade(P)}</th></tr></tfoot></table><p><b>Result:</b> ${pass?'PASS':'FAIL'} &nbsp; | &nbsp; <b>Percentage:</b> ${P}% &nbsp; | &nbsp; <b>Position in class:</b> ${posText(exam,classId,sid)}</p>${sigs(['Class teacher','Exam controller','Principal'],'dmc')}</div>`;
  }).join('');
}

  return `<div class="head"><h1>Subjects</h1><div class="tools"><select aria-label="Class" data-c="subClass"><option value="">Select class</option>${subjClassList().map(x=>`<option value="${x.id}" ${x.id===c?'selected':''}>${esc(refText('classes',x.id))}</option>`).join('')}</select>${can('subjects','create')?'<button class="btn pri" data-a="subAdd">Add subject</button>':''}</div></div><div class="card flush" id="subbody">${subjBody()}</div>`};
INP.subClass=v=>{S.ctx.subClass=v;render()};
INP.subTick=async(v,el)=>{
  if(!subjEdit())return;const c=subjCur(),n=el.dataset.n;if(!c)return;
  const cur=rows('subjects').filter(x=>x.classId===c&&x.name.toLowerCase()===n.toLowerCase());
  if(el.checked){if(!cur.length)DB.c.subjects.push({id:uid(),sid:S.sid,ts:Date.now(),name:n,classId:c})}
  else{
    const ids=cur.map(x=>x.id);
    const used=['timetable','homework','tests','results','examtt'].some(k=>rows(k).some(r=>ids.includes(r.subjectId)));
    if(used&&!await ask(n+' is already used in this class (timetable, homework or marks). Remove it from the class anyway?','Remove')){el.checked=true;return}
    DB.c.subjects=DB.c.subjects.filter(x=>!ids.includes(x.id));
  }
  save();render();
};
ACT.subAdd=()=>{
  if(!can('subjects','create'))return;
  openModal({title:'Add subject',saveLabel:'Add',html:'<form class="grid"><label class="full"><span>Subject name *</span><input name="name" required placeholder="e.g. Mathematics (use commas to add many)"></label></form>',
    save:(close,el)=>{const f=el.querySelector('form');if(!f.reportValidity())return;
      const have=new Set(subjectNames().map(x=>x.toLowerCase()));let n=0;
      f.name.value.split(',').map(x=>x.trim()).filter(Boolean).forEach(x=>{if(have.has(x.toLowerCase()))return;have.add(x.toLowerCase());DB.c.subjcat.push({id:uid(),sid:S.sid,ts:Date.now(),name:x});n++});
      if(!n){toast('This subject already exists.','bad');return}
      save();close();render();toast(n+' subject'+(n>1?'s':'')+' added. Select a class and tick it.')}});
};

/* class tests: Test / Test Results, year and month wise */
function byMonth(k,L,rowFn,head){const Y=S.ctx[k+'Y']||new Date().getFullYear();let h='';
  for(let i=0;i<12;i++){const X=L.filter(r=>ymFilter(k,r.date)&&+(r.date||'').slice(5,7)-1===i);if(!X.length)continue;
    h+=`<div class="card flush" style="margin-bottom:14px"><div class="mh"><h3>${MONF[i]} ${Y} <span class="mute">(${X.length})</span></h3></div><div class="tw"><table><thead><tr>${head}</tr></thead><tbody>${X.map(rowFn).join('')}</tbody></table></div></div>`}
  return h||'<div class="card"><div class="empty"><b>Nothing here</b>No records for this period.</div></div>'}

  const tb=(t,l)=>`<button class="btn ${tab===t?'pri':''}" style="flex:1;padding:12px;font-size:15px" data-a="tsTab" data-t="${t}">${l}</button>`;

    if(can('tests','create'))tools='<button class="btn pri" data-a="tdAdd">Add test</button>';
  }else{
    const L=scope('tests',rows('tests')).filter(r=>(!cf||r.classId===cf)&&(!day||r.date===day)&&(!stu||r.studentId===stu)).sort((a,b)=>(a.date||'').localeCompare(b.date||''));
    body=byMonth('ts',L,r=>{const d=rows('tdefs').find(t=>t.name===r.exam&&t.classId===r.classId&&t.subjectId===r.subjectId)||{},ok=pct(r.obtained,r.total)>=cfg().pass;
      return `<tr><td>${esc(r.exam)}</td><td>${cl(r.classId)}</td>${stf?`<td>${esc(refText('students',r.studentId))}</td>`:''}<td>${sub(r.subjectId)}</td><td>${esc(d.details||'')}</td><td>${fmtD(r.date)}</td><td>${r.obtained} / ${r.total}</td><td>${tag(ok?'Pass':'Fail',ok?'ok':'bad')}</td></tr>`},`<th>Test Name</th><th>Class</th>${stf?'<th>Student</th>':''}<th>Subjects</th><th>Test Details</th><th>Date</th><th>Test Marks</th><th>Pass/Fail</th>`);
    if(can('tests','create'))tools='<button class="btn pri" data-a="tool" data-k="tests" data-t="marks">Enter test marks</button>';
  }

/* attendance: year > month for students and teachers */
const cnt=(L,id)=>{let p=0,a=0,v=0;L.forEach(x=>{const m=x.marks&&x.marks[id];if(m==='A')a++;else if(m==='V')v++;else if(m)p++});return {p,a,v,t:p+a+v}};
const cntRow=(n,c)=>`<tr><td>${n}</td><td class="num">${c.p}</td><td class="num">${c.a}</td><td class="num">${c.v}</td><td class="num">${c.t?pct(c.p,c.t)+'%':'-'}</td></tr>`;
const cntHead=f=>`<table><thead><tr><th>${f}</th><th class="num">Present</th><th class="num">Absent</th><th class="num">Leave</th><th class="num">%</th></tr></thead><tbody>`;
function stuAttView(){const me=byId('students',S.user.ref)||{},Y=S.ctx.saY||new Date().getFullYear(),M=S.ctx.saM??'';
  const A=rows('att').filter(x=>x.classId===me.classId&&x.marks&&x.marks[me.id]&&x.date.slice(0,4)==Y);let body;
  if(M==='')body=cntHead('Month')+MONF.map((n,i)=>cntRow(n,cnt(A.filter(x=>+x.date.slice(5,7)-1===i),me.id))).join('')+'</tbody></table>';
  else body=`<table><thead><tr><th>Date</th><th>Status</th></tr></thead><tbody>${A.filter(x=>+x.date.slice(5,7)-1===M).sort((a,b)=>a.date.localeCompare(b.date)).map(x=>`<tr><td>${fmtD(x.date)}</td><td>${tag(ST.find(q=>q[0]===x.marks[me.id])[1],x.marks[me.id]==='A'?'bad':'ok')}</td></tr>`).join('')||'<tr><td colspan="2" class="mute">No records.</td></tr>'}</tbody></table>`;
  return `<div class="head"><h1>My attendance</h1></div><div class="card"><h3 style="margin-top:0">${esc(refText('classes',me.classId))}</h3>${ymBar('sa')}</div><div class="card flush tw" style="margin-top:14px">${body}</div>`}
function tattReport(){
  const t=S.ctx.taT||'',day=S.ctx.taD||'',Y=+(S.ctx.taY||new Date().getFullYear()),M0=S.ctx.taM??'';
  const inP=x=>day?x.date===day:(x.date.slice(0,4)==Y&&(M0===''||+x.date.slice(5,7)-1===M0));
  const A=rows('tatt').filter(inP),T=rows('teachers').filter(x=>x.status==='Active'),ids=T.map(x=>x.id);let title,body;
  if(day){title='Day wise - '+fmtD(day);
    body=`<table><thead><tr><th>Teacher</th><th>Status</th></tr></thead><tbody>${(t?T.filter(x=>x.id===t):T).map(x=>{const rec=A.find(r=>r.marks&&r.marks[x.id]);return `<tr><td>${esc(x.name)}</td><td>${stTag(rec&&rec.marks[x.id])}</td></tr>`}).join('')||'<tr><td colspan="2" class="mute">No teachers.</td></tr>'}</tbody></table>`;
  }else if(t){const x=byId('teachers',t)||{};title='Teacher wise - '+(x.name||'')+' - '+Y+(M0!==''?' '+MONF[M0]:'');
    if(M0==='')body=cntHead('Month')+MONF.map((n,i)=>cntRow(n,cnt(A.filter(r=>+r.date.slice(5,7)-1===i),t))).join('')+cntRow('<b>Year '+Y+'</b>',cnt(A,t))+'</tbody></table>';
    else body=`<table><thead><tr><th>Date</th><th>Status</th></tr></thead><tbody>${A.filter(r=>r.marks&&r.marks[t]).sort((p,q)=>p.date.localeCompare(q.date)).map(r=>`<tr><td>${fmtD(r.date)}</td><td>${stTag(r.marks[t])}</td></tr>`).join('')||'<tr><td colspan="2" class="mute">No records.</td></tr>'}</tbody></table>`;
  }else{title='All teachers - '+Y+(M0!==''?' '+MONF[M0]:'');
    body=cntHead('Teacher')+T.map(x=>cntRow(esc(x.name),cnt(A,x.id))).join('')+'</tbody></table>';
    if(M0==='')body+=`<div style="padding:10px 14px 0"><b>Year ${Y} - month by month</b></div>`+cntHead('Month')+MONF.map((n,i)=>{const q=agg(A.filter(r=>+r.date.slice(5,7)-1===i),ids);return `<tr><td>${n}</td><td class="num">${q.p}</td><td class="num">${q.a}</td><td class="num">${q.v}</td><td class="num">${q.t?pct(q.p,q.t)+'%':'-'}</td></tr>`}).join('')+'</tbody></table>';
  }
  return `<div style="height:18px"></div><div class="card flush"><div class="mh"><h3>Teachers attendance report</h3></div><div style="padding:12px 14px"><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px"><select data-c="taT" aria-label="Teacher"><option value="">All teachers</option>${T.map(x=>`<option value="${x.id}" ${x.id===t?'selected':''}>${esc(x.name)}</option>`).join('')}</select><input type="date" data-c="taD" value="${day}" style="width:auto" aria-label="Day">${day?'<button class="btn sm" data-a="taClr">Clear day</button>':''}</div>${ymBar('ta')}<p class="mute" style="margin:4px 0 0;font-size:13px"><b>${esc(title)}</b></p></div><div class="tw">${body}</div></div>`}

/* certificates */
const N1=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'],N10=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
const n2w=n=>n<20?N1[n]:n<100?N10[n/10|0]+(n%10?' '+N1[n%10]:''):n<1000?N1[n/100|0]+' Hundred'+(n%100?' '+n2w(n%100):''):n2w(n/1000|0)+' Thousand'+(n%1000?' '+n2w(n%1000):'');
const ORD={One:'First',Two:'Second',Three:'Third',Five:'Fifth',Eight:'Eighth',Nine:'Ninth',Twelve:'Twelfth'};
function dateWords(v){const m=String(v||'').match(/^(\d{4})-(\d{2})-(\d{2})/);if(!m)return '';const w=n2w(+m[3]).split(' ');let l=w.pop();l=ORD[l]||(l.endsWith('y')?l.slice(0,-1)+'ieth':l+'th');return [...w,l].join(' ')+' '+MONF[+m[2]-1]+' '+n2w(+m[1])}
document.addEventListener('input',e=>{const t=e.target;if(t.name==='dob'&&t.form&&t.form.dobWords)t.form.dobWords.value=dateWords(t.value)});
document.addEventListener('change',e=>{const t=e.target;if(t.name==='studentId'&&t.form&&t.form.dobWords){const x=byId('students',t.value);if(x&&x.dob){t.form.dob.value=x.dob;t.form.dobWords.value=dateWords(x.dob)}}});
M.certificates.fields.push({k:'dueUpTo',l:'Paid all dues up to',t:'date'},{k:'dob',l:'Date of birth',t:'date'},{k:'dobWords',l:'In words (auto)',t:'text'},{k:'character',l:'Character',t:'text',def:'Good'},{k:'preparedBy',l:'Prepared by',t:'text'},{k:'checkedBy',l:'Checked by',t:'text'});
M.certificates.hideFor=f=>S.user.role==='student'&&['studentId','status','issueDate','dueUpTo','dob','dobWords','character','preparedBy','checkedBy'].includes(f.k);
{const b0=M.certificates.before;M.certificates.before=(r,n)=>{const e=b0(r,n);if(e)return e;const x=byId('students',r.studentId)||{};if(!r.dob&&x.dob)r.dob=x.dob;if(r.dob)r.dobWords=dateWords(r.dob)}}
{const d0=M.certificates.doc;M.certificates.doc=r=>{
  if(!LEAVE.includes(r.type))return d0(r);

  return `<div class="cert">${docHead()}<h1>${esc(r.type)}</h1><p style="display:flex;justify-content:space-between"><span>Sr. No: ${u(r.no)}</span><span>Registration ID: ${u(x.regNo)}</span></p>
  <p>It is Certified that Mr/Miss: ${u(x.name)}</p><p>Son/Daughter of: ${u(x.fatherName)}</p><p>Was admitted in this School on: ${u(fmtD(x.admissionDate))}</p><p>And left the school on: ${u(fmtD(x.withdrawDate||r.issueDate||today()))}</p>
  <p>${f?'She':'He'} was reading in class: ${u(wd?wd.className:refText('classes',x.classId))}</p><p>Under registration ID: ${u(x.regNo)}</p><p>${f?'She':'He'} has paid all due up to: ${u(fmtD(r.dueUpTo))}</p>

  ${sigs(['Prepared by: '+(r.preparedBy||''),'Checked by: '+(r.checkedBy||''),'Principal Sign'+(cfg().principal?': '+cfg().principal:'')],'cert')}</div>`}}

const ST=[['P','Present',''],['A','Absent','a'],['L','Late','l'],['V','Leave','l']];
const segHTML=(name,val)=>`<div class="seg">${ST.map(([k,l,c])=>`<label><input type="radio" class="${c}" name="${name}" value="${k}" ${val===k?'checked':''}><span>${l}</span></label>`).join('')}</div>`;
const waPhone=p=>{let d=String(p||'').replace(/\D/g,'');if(d.startsWith('00'))d=d.slice(2);else if(d.startsWith('0'))d=cfg().countryCode+d.slice(1);return d};
PAGES.attendance=()=>{
  const u=S.user;
  if(u.role==='student'){

const MAXATT=300*1024;
function threadsView(){
  const u=S.user,adm=isAdm(),admin=DB.users.find(x=>x.sid===S.sid&&x.role==='admin');
  const msgs=rows('messages').filter(m=>!(m.deletedFor||[]).includes(u.id));
  let th=adm?S.ctx.thread:u.id,list='';
  if(adm){
    const people=DB.users.filter(x=>x.sid===S.sid&&x.role!=='admin');
    const last=id=>Math.max(0,...msgs.filter(m=>m.thread===id).map(m=>m.ts));
    const talk=people.filter(p=>msgs.some(m=>m.thread===p.id)).sort((a,b)=>last(b.id)-last(a.id));
    const rest=people.filter(p=>!talk.includes(p));
    list=`<div class="clist">${talk.map(p=>{const un=msgs.filter(m=>m.thread===p.id&&m.from!==admin.id&&!m.read).length;return `<a class="${p.id===th?'on':''}" data-a="thread" data-id="${p.id}"><b>${esc(p.name)}</b> ${un?`<span class="tag bad">${un}</span>`:''}<br><small class="mute">${esc({staff:'Staff',teacher:'Teacher',student:'Student'}[p.role])}</small></a>`}).join('')||'<div class="empty">No conversations yet.</div>'}${rest.length?`<div style="padding:10px"><select data-c="newThread" aria-label="Start a conversation"><option value="">Message someone…</option>${rest.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div>`:''}</div>`;
  }
  const mine=th?msgs.filter(m=>m.thread===th).sort((a,b)=>a.ts-b.ts):[];
  if(th&&adm&&admin)mine.forEach(m=>{if(m.from!==admin.id)m.read=true});
  const person=th&&DB.users.find(x=>x.id===th);
  const canSend=S.user.role!=='master'&&can('communication','create')&&th;
  const bubble=m=>{const me=m.from===u.id;const a=m.att;
    return `<div class="m ${me?'me':''}">${m.deleted?'<div style="font-style:italic;opacity:.7">This message was deleted</div>':''}${a&&!m.deleted?(a.kind==='image'?`<img src="${a.data}" alt="${esc(a.name)}">`:a.kind==='audio'?`<audio controls src="${a.data}"></audio>`:`<a href="${a.data}" download="${esc(a.name)}">${esc(a.name)}</a>`):''}${m.text&&!m.deleted?`<div>${esc(m.text)}</div>`:''}<small>${me?'You':esc((DB.users.find(x=>x.id===m.from)||{}).name||'')} - ${new Date(m.ts).toLocaleString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}</small> <button type="button" class="lnk" data-a="msgMenu" data-id="${m.id}" aria-label="Message options" title="Delete message">&#8942;</button></div>`};
  const right=`<div style="display:flex;flex-direction:column;min-width:0"><div style="padding:10px 14px;border-bottom:1px solid var(--line)"><b>${adm?(person?esc(person.name):'Select a conversation'):'School Admin'}</b>${S.user.role==='admin'&&person?profileBox(person):''}</div><div class="msgs" id="msgs">${mine.length?mine.map(bubble).join(''):`<div class="empty">${th?'No messages yet. Say hello.':'Choose someone from the list.'}</div>`}</div>${canSend?`<form class="cmp" data-s="sendMsg"><input type="text" name="t" placeholder="Type a message" autocomplete="off" aria-label="Message"><button class="btn pri">Send</button><button type="button" class="btn" data-a="pick" data-id="fDoc">Document</button><button type="button" class="btn" data-a="pick" data-id="fGal">Gallery</button><button type="button" class="btn" data-a="pick" data-id="fCam">Camera</button><button type="button" class="btn" data-a="rec" id="recBtn">Voice</button></form><input hidden type="file" id="fDoc" data-c="file"><input hidden type="file" id="fGal" accept="image/*" data-c="file"><input hidden type="file" id="fCam" accept="image/*" capture="environment" data-c="file">`:''}</div>`;
  return `<div class="card flush"><div class="chat" style="${adm?'':'grid-template-columns:1fr'}">${list}${right}</div></div>`;
}

/* ============ AI assistant ============ */
function snapshot(){
  const td=today(),tm=thisMonth(),st=activeStudents();
  const abs=[];rows('att').filter(a=>a.date===td).forEach(a=>Object.entries(a.marks).forEach(([id,v])=>{if(v==='A')abs.push(refText('students',id)+' / '+refText('classes',a.classId))}));
  const dues={};rows('fees').forEach(f=>{if(fbal(f)>0)dues[f.studentId]=(dues[f.studentId]||0)+fbal(f)});
  return {school:curSchool().name,currency:cfg().currency,today:td,students:st.length,perClass:rows('classes').map(c=>({class:LBL.classes(c),students:st.filter(s=>s.classId===c.id).length})),teachers:rows('teachers').filter(t=>t.status==='Active').length,absentToday:abs,feeDueTop:Object.entries(dues).sort((a,b)=>b[1]-a[1]).slice(0,15).map(([id,v])=>({student:refText('students',id),due:v})),totalDue:Object.values(dues).reduce((a,b)=>a+b,0),incomeThisMonth:rows('income').filter(r=>(r.date||'').startsWith(tm)).reduce((a,r)=>a+r.amount,0),expensesThisMonth:rows('expenses').filter(r=>(r.date||'').startsWith(tm)).reduce((a,r)=>a+r.amount,0),notices:rows('notices').slice(-3).map(n=>n.title),recentExamResults:topExam()};
}
function topExam(){
  const rs=rows('results');if(!rs.length)return null;const ex=rs[rs.length-1].exam,cl=rs[rs.length-1].classId;
  const t={};rs.filter(r=>r.exam===ex&&r.classId===cl).forEach(r=>{t[r.studentId]=t[r.studentId]||{o:0,t:0};t[r.studentId].o+=r.obtained;t[r.studentId].t+=r.total});
  return {exam:ex,class:refText('classes',cl),top:Object.entries(t).map(([id,v])=>({student:refText('students',id),percent:pct(v.o,v.t)})).sort((a,b)=>b.percent-a.percent).slice(0,5)};
}
function localAnswer(q){
  q=q.toLowerCase();const s=snapshot();
  if(/absent|غیر حاضر/.test(q))return s.absentToday.length?'Absent today ('+s.absentToday.length+'): '+s.absentToday.join('; ')+'.':'No absences are recorded for today yet.';
  if(/(fee|due|outstanding|unpaid|defaulter)/.test(q)&&/(pending|due|outstanding|unpaid|defaulter|balance|remaining)/.test(q))return `Total outstanding fees: ${money(s.totalDue)}. Highest balances: ${s.feeDueTop.slice(0,5).map(x=>x.student+' ('+money(x.due)+')').join('; ')||'none'}.`;
  if(/(income|collect|received)/.test(q))return `Income this month: ${money(s.incomeThisMonth)}.`;
  if(/expense|spent|spending/.test(q))return `Expenses this month: ${money(s.expensesThisMonth)}.`;
  if(/profit|net|balance sheet/.test(q))return `Net this month: ${money(s.incomeThisMonth-s.expensesThisMonth)} (income ${money(s.incomeThisMonth)}, expenses ${money(s.expensesThisMonth)}).`;
  if(/teacher/.test(q)&&/(how many|total|count|number)/.test(q))return `There are ${s.teachers} active teachers.`;
  if(/student/.test(q)&&/(how many|total|count|number)/.test(q))return `There are ${s.students} active students. By class: ${s.perClass.map(c=>c.class+' '+c.students).join(', ')||'no classes yet'}.`;
  if(/top|best|topper|position|rank/.test(q)){const t=s.recentExamResults;return t?`${t.exam} - ${t.class}: ${t.top.map((x,i)=>`${i+1}. ${x.student} (${x.percent}%)`).join('; ')}.`:'No exam results have been entered yet.'}
  if(/notice/.test(q))return s.notices.length?'Latest notices: '+s.notices.join('; ')+'.':'There are no notices yet.';
  return null;
}
async function askClaude(q){
  const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:1000,system:'You are the assistant inside a school management system. Answer briefly using only the JSON school data provided. If the data does not contain the answer, say so. Reply in the language of the question.',messages:[{role:'user',content:'School data:\n'+JSON.stringify(snapshot())+'\n\nQuestion: '+q}]})});
  const d=await r.json();if(!d.content)throw new Error('no answer');return d.content.map(i=>i.type==='text'?i.text:'').join('').trim();
}

async function runAsk(q){

  if(t===REPS[3]){const b=activeStudents().map(s=>{let P=0,A=0,V=0;rows('att').filter(a=>a.classId===s.classId&&inR(a.date)&&a.marks[s.id]).forEach(a=>{const v=a.marks[s.id];if(v==='A')A++;else if(v==='V')V++;else P++});const T=P+A+V;return [s.name,refText('classes',s.classId),P,A,V,T?pct(P,T)+'%':'-']});return {head:['Student','Class','Present','Absent','Leave','Attendance'],body:b}}
  if(t===REPS[4]){const b=rows('teachers').map(x=>{let P=0,A=0,V=0;rows('tatt').filter(a=>inR(a.date)&&a.marks[x.id]).forEach(a=>{const v=a.marks[x.id];if(v==='A')A++;else if(v==='V')V++;else P++});const T=P+A+V;return [x.name,P,A,V,T?pct(P,T)+'%':'-']});return {head:['Teacher','Present','Absent','Leave','Attendance'],body:b}}
  if(t===REPS[5]){const m={};rows('income').filter(r=>inR(r.date)).forEach(r=>{const k=r.date.slice(0,7);m[k]=m[k]||[0,0];m[k][0]+=r.amount});rows('expenses').filter(r=>inR(r.date)).forEach(r=>{const k=r.date.slice(0,7);m[k]=m[k]||[0,0];m[k][1]+=r.amount});const b=Object.entries(m).sort().map(([k,v])=>[fmtM(k),v[0],v[1],v[0]-v[1]]);return {head:['Month','Income','Expenses','Net'],body:b,foot:['Total',...[1,2,3].map(i=>b.reduce((a,r)=>a+r[i],0))]}}
  if(t===REPS[6]){const b=rows('salaries').filter(s=>s.status==='Paid'&&inR(s.paidDate)).map(s=>[fmtD(s.paidDate),refText('teachers',s.teacherId),fmtM(s.month),s.method,s.net]);return {head:['Paid on','Teacher','Month','Method','Net pay'],body:b,foot:['Total','','','',b.reduce((a,r)=>a+r[4],0)]}}
  const g={};rows('results').forEach(r=>{const k=r.exam+'|'+r.classId;g[k]=g[k]||{};g[k][r.studentId]=g[k][r.studentId]||{o:0,t:0};g[k][r.studentId].o+=r.obtained;g[k][r.studentId].t+=r.total});

  return {head:['Exam','Class','Students','Average','Pass rate','Topper'],body:b};
}

  o=o||{};const prev=S.sid,base=o.username||'demo';let dun=base,di=1;while(DB.users.some(x=>String(x.username).toLowerCase()===dun.toLowerCase()))dun=base+(++di);
  const sch=registerSchool({name:o.name||'Demo Public School',address:o.address||'Kabul, Afghanistan',phone:o.phone||'0700000000',email:o.email||'info@demo.school',admin:o.admin||'Demo Admin',username:dun,password:o.password||'demo123',currency:o.currency,currencyCountry:o.currencyCountry});
  sch.demoUser=dun;
  S.sid=sch.id;const T=Date.now(),td=today(),tm=thisMonth();
  const add=(c,r)=>{const o={id:uid(),sid:sch.id,ts:T,...r};DB.c[c].push(o);return o};
  const cls=[['Class 1',1500],['Class 2',1700],['Class 3',1900]].map(([n,f])=>add('classes',{name:n,section:'A',room:'R'+n.slice(-1),fee:f}));
  const tn=[['Ahmad Shah','Female','Mathematics'],['Zainab Rahimi','Female','English'],['Mohammad Nasir','Male','Science']];
  const teachers=tn.map(([n,g,s],i)=>{const t=add('teachers',{name:n,gender:g,phone:'07000000'+(10+i),qualification:'B.Ed',subject:s,salary:12000+i*1000,joinDate:td,status:'Active',tNo:'TCH-000'+(i+1)});makeAccount('teacher',t,{pw:'1234'});return t});
  cls.forEach((c,i)=>c.teacherId=teachers[i].id);
  const subj=[];cls.forEach(c=>['Mathematics','English','Science'].forEach((n,j)=>subj.push(add('subjects',{name:n,code:n.slice(0,3).toUpperCase(),classId:c.id,teacherId:teachers[j].id}))));
  const names=[['Ali Rahimi','Male'],['Maryam Noori','Female'],['Hamid Karimi','Male'],['Sara Ahmadi','Female'],['Omar Sadat','Male'],['Zahra Hashemi','Female'],['Bilal Popal','Male'],['Hana Safi','Female'],['Yusuf Amiri','Male']];
  const studs=names.map(([n,g],i)=>{const c=cls[i%3];const s=add('students',{name:n,fatherName:n.split(' ')[1]+' Sr.',gender:g,dob:'2017-03-1'+(i%9),classId:c.id,rollNo:String(Math.floor(i/3)+1),phone:'0700100'+(100+i),altPhone:'',admissionDate:td,status:'Active',address:'Kabul',regNo:'STD-000'+(i+1)});makeAccount('student',s,{pw:'1234'});return s});
  studs.forEach((s,i)=>{const c=byId('classes',s.classId);const f=add('fees',{studentId:s.id,type:'Tuition',month:tm,amount:c.fee,discount:0,paid:0,payments:[],receiptNo:'RC-000'+(i+1),date:td});
    if(i%3!==2){const p=i%3===0?c.fee:Math.round(c.fee/2);f.paid=p;f.payments.push({date:td,amt:p,method:'Cash',txn:''});add('income',{title:`Fee ${f.receiptNo} - ${s.name}`,category:'Fees',amount:p,date:td,method:'Cash',note:'Auto-recorded',ref:f.id})}});
  cls.forEach(c=>{const m={};studs.filter(s=>s.classId===c.id).forEach((s,i)=>m[s.id]=(c===cls[0]&&i===0)?'A':'P');add('att',{date:td,classId:c.id,marks:m})});
  const a=studs.find(s=>s.classId===cls[0].id);add('wa',{studentId:a.id,name:a.name,phone:waPhone(a.phone),date:td,status:'Pending',text:WA_DEFAULT.replace('{student}',a.name).replace('{class}','Class 1 - A').replace('{date}',fmtD(td)).replace('{school}',sch.name)});
  studs.forEach((s,i)=>subj.filter(x=>x.classId===s.classId).forEach((x,j)=>add('results',{exam:'1st Terms Examination',classId:s.classId,subjectId:x.id,studentId:s.id,total:100,obtained:55+((i*7+j*11)%43)})));
  add('notices',{title:'Welcome to the new term',audience:'All',date:td,body:'Classes start at 8:00 am. Please make sure every student has their books and uniform.'});
  add('schedule',{title:'Exams',type:'Exam',startDate:td,endDate:td,note:''});
  add('income',{title:'Donation',category:'Donation',amount:20000,date:td,method:'Bank transfer',note:''});add('expenses',{title:'Electricity bill',category:'Utilities',amount:3500,date:td,method:'Cash',note:''});
  [['Saturday',1],['Saturday',2],['Sunday',1]].forEach(([d,p],i)=>{const s=subj[i];add('timetable',{classId:cls[0].id,day:d,period:p,start:'08:0'+p,end:'08:4'+p,subjectId:s.id,teacherId:s.teacherId})});
  add('homework',{classId:cls[0].id,subjectId:subj[0].id,title:'Practice page 12',date:td,dueDate:td,description:'Solve all exercises.',by:'Ahmad Shah'});
  S.sid=prev;save();return sch;
}

/* ============ login / register / forgot ============ */
function loginView(){
  const m=S.auth,pf=S.ctx.prefill||{};
  const tabs=`<div class="tabs"><a class="${m==='login'?'on':''}" data-a="auth" data-m="login">Sign in</a><a class="${m==='register'?'on':''}" data-a="auth" data-m="register">Register school</a><a class="${m==='forgot'?'on':''}" data-a="auth" data-m="forgot">Forgot password</a></div>`;
  const L=(n,l,t='text',x='')=>`<label><span>${l}</span><input name="${n}" type="${t}" required ${x}></label>`;
  let f='';
  if(m==='login')f=`<form data-s="login">${S.ctx.regDone?`<div class="note">School registered. Your Registration ID is <b>${esc(S.ctx.regDone)}</b>. Sign in with the admin username you chose.</div>`:''}${L('username','Username','text',`value="${esc(pf.u||'')}" autocomplete="username"`)}${L('password','Password','password',`value="${esc(pf.p||'')}" autocomplete="current-password"`)}<div class="err" id="aerr"></div><button class="btn pri">Sign in</button><button type="button" class="btn" data-a="tryDemo">Try the demo school</button></form>`;
  if(m==='register')f=`<form data-s="register">${L('name','School name')}${L('address','Address')}${L('phone','School phone','tel')}<label><span>Email</span><input name="email" type="email"></label>${L('admin','School admin full name')}${L('username','Admin username','text','autocomplete="off"')}${L('password','Password (at least 6 characters)','password','minlength="6"')}<div class="err" id="aerr"></div><button class="btn pri">Register school</button></form>`;
  if(m==='forgot')f=`<form data-s="forgot">${L('username','Username')}${L('reg','School Registration ID')}${L('phone','Phone number on your account')}${L('password','New password (at least 6 characters)','password','minlength="6"')}<div class="err" id="aerr"></div><button class="btn pri">Reset password</button></form>`;
  return `<div class="auth"><div class="l"><div class="lg"><img src="${LOGO}" alt="IUCS Master logo"></div><h1>School Management System</h1><div class="by">@IUCS Master</div></div><div class="r"><div style="width:100%;max-width:400px">${tabs}${f}</div></div></div>`;
}
ACT.auth=d=>{S.auth=d.m;S.ctx.regDone=null;render()};
const aerr=t=>{const e=$('#aerr');if(e)e.textContent=t};
SUB.login=f=>{
  const un=f.username.value.trim().toLowerCase(),pw=hash(f.password.value);
  const u=DB.users.find(x=>x.username.toLowerCase()===un&&x.pass===pw);
  if(!u)return aerr('Wrong username or password.');
  if(u.role==='student'&&u.leaveCert)finalizeLeave(u);
  if(u.active===false)return aerr('This account is disabled. Ask the school admin.');
  const sc=u.sid&&DB.schools.find(s=>s.id===u.sid);if(u.role!=='master'&&(!sc||sc.active===false))return aerr('This school is suspended. Contact the master admin.');
  let back=false;if(sc&&sc.pendingDelete){if(u.role!=='admin')return aerr('This school account was deleted by its School Admin.');delete sc.pendingDelete;save();back=true}
  S.user=u;S.sid=u.role==='master'?null:u.sid;S.page=u.role==='master'?'mdash':'dashboard';S.ctx={};render();if(back)setTimeout(()=>toast('Welcome back! Your account deletion was cancelled.','ok'),60);
};
SUB.register=f=>{
  const d=Object.fromEntries(new FormData(f));
  if(DB.users.some(u=>u.username.toLowerCase()===d.username.trim().toLowerCase()))return aerr('That username is already taken.');
  const s=registerSchool(d);S.auth='login';S.ctx.regDone=s.regId;render();
};
SUB.forgot=f=>{
  const d=Object.fromEntries(new FormData(f)),sc=DB.schools.find(s=>s.regId===d.reg.trim().toUpperCase());
  const u=sc&&DB.users.find(x=>x.sid===sc.id&&x.username.toLowerCase()===d.username.trim().toLowerCase());
  if(!u||String(u.phone||'').replace(/\D/g,'')!==d.phone.replace(/\D/g,'')||!d.phone.trim())return aerr('Username, Registration ID and phone number do not match any account.');
  u.pass=hash(d.password);CP(u,d.password);save();S.auth='login';S.ctx.prefill={u:u.username,p:''};render();toast('Password reset. Sign in with the new password.','ok');
};

/* ============ shell & boot ============ */
function shell(inner){
  const u=S.user,sc=curSchool(),master=u.role==='master';
  const groups=(master&&!S.sid)?[['Master admin',[['mdash','Dashboard'],['madmins','School admins'],['mbackup','Full backup'],['mysettings','Settings'],['profile','My account']]]]:NAV.map(([g,items])=>[g,items.filter(([k])=>k==='profile'||can(k,'view'))]).filter(g=>g[1].length);
  const nav=groups.map(([g,items])=>`<div class="ng">${g}</div>${items.map(([k,l])=>`<a class="${S.page===k?'on':''}" data-a="nav" data-p="${k}">${l}</a>`).join('')}`).join('');
  return `<div class="app"><aside class="side ${S.side?'open':''}"><div class="brand"><div class="bl"><img src="${LOGO}" alt=""><div><b>${sc?esc(sc.name):'School Management System'}</b><small>${sc?(showReg()?esc(sc.regId):'School portal'):'Master admin'}</small></div></div></div><nav class="nav">${nav}</nav></aside><div class="main">${master&&S.sid?`<div class="banner"><span>Viewing <b>${esc(sc.name)}</b> as Master Admin.</span><button class="btn sm" data-a="exitSchool">Back to master dashboard</button></div>`:''}<header class="top"><button class="btn burger" data-a="menu" aria-label="Menu">Menu</button><span class="sp"></span><div class="who"><b>${esc(u.name)}</b><br><span class="mute">${u.role==='admin'?'School Admin':u.role==='master'?'Master Admin':ROLEN[u.role]}</span></div><button class="btn sm" data-a="logout">Logout</button></header><main class="content">${inner}</main></div></div>`;
}
let lastPage=null;
function render(){
  const root=$('#root'),y=window.scrollY;
  if(!S.user){root.innerHTML=loginView();return}
  const master=S.user.role==='master';
  if(master&&!S.sid&&!['mdash','madmins','mbackup','mysettings','profile'].includes(S.page))S.page='mdash';
  if(!(master&&!S.sid)&&(!PAGES[S.page]||(S.page!=='profile'&&!can(S.page,'view')))){S.page=NAV.flatMap(g=>g[1]).map(x=>x[0]).find(k=>k==='profile'||can(k,'view'))}
  let inner;try{inner=PAGES[S.page]()}catch(e){console.error(e);inner=`<div class="card"><b>Something went wrong showing this page.</b><p class="mute">${esc(e.message)}</p></div>`}
  root.innerHTML=shell(inner);
  if(POST[S.page])POST[S.page]();
  window.scrollTo(0,lastPage===S.page?y:0);lastPage=S.page;
}
window.addEventListener('DOMContentLoaded',async()=>{await load();render()});

{const _m=PAGES.mdash;PAGES.mdash=()=>(S.user.pass===hash('master123')?'<div class="note"><b>Security:</b> the default master password is still active. Change it now under My account.</div>':'')+_m()}

/* ---------- dashboard charts ---------- */
const compact=n=>{n=Math.abs(n);return n>=1e6?+(n/1e6).toFixed(1)+'M':n>=1e3?+(n/1e3).toFixed(1)+'k':String(Math.round(n))};
const dShort=d=>{const [,m,dd]=d.split('-');return +dd+' '+MON[+m-1]};
function attTrend(){
  const by={};
  rows('att').forEach(a=>{const o=by[a.date]||(by[a.date]={p:0,t:0});Object.values(a.marks||{}).forEach(v=>{if(v==='A'||v==='P'||v==='L'){o.t++;if(v!=='A')o.p++}})});
  return Object.keys(by).filter(d=>by[d].t).sort().slice(-14).map(d=>({d,v:Math.round(by[d].p/by[d].t*1000)/10}));
}
function lineChart(pts){
  const W=640,H=230,L=38,R=14,T=14,B=30;
  const vs=pts.map(p=>p.v),lo=Math.max(0,Math.floor((Math.min(...vs)-5)/10)*10),hi=100;
  const x=i=>L+(pts.length===1?0.5:i/(pts.length-1))*(W-L-R),y=v=>T+(1-(v-lo)/(hi-lo))*(H-T-B);
  let g='';for(let i=0;i<=4;i++){const v=lo+(hi-lo)*i/4;g+=`<line class="gl" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end">${Math.round(v)}%</text>`}
  const step=Math.ceil(pts.length/6);let xl='';pts.forEach((p,i)=>{if(i%step===0||i===pts.length-1)xl+=`<text x="${x(i)}" y="${H-8}" text-anchor="middle">${dShort(p.d)}</text>`});
  const line=pts.map((p,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(p.v).toFixed(1)).join(' ');
  const area=line+` L${x(pts.length-1)} ${y(lo)} L${x(0)} ${y(lo)}Z`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Daily attendance rate over the last ${pts.length} days"><defs><linearGradient id="ag" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--c-a)" stop-opacity=".28"/><stop offset="1" stop-color="var(--c-a)" stop-opacity="0"/></linearGradient></defs>${g}<path d="${area}" fill="url(#ag)"/><path class="ln" d="${line}"/>${pts.map((p,i)=>`<circle class="pt" cx="${x(i)}" cy="${y(p.v)}" r="4"><title>${fmtD(p.d)}: ${p.v}% present</title></circle>`).join('')}${xl}</svg>`;
}
function financeData(){

  for(let i=5;i>=0;i--){const dd=new Date(d.getFullYear(),d.getMonth()-i,1),k=dd.getFullYear()+'-'+pad(dd.getMonth()+1);
    const sum=c=>rows(c).filter(r=>(r.date||'').startsWith(k)).reduce((a,r)=>a+(+r.amount||0),0);
    out.push({k,l:MON[dd.getMonth()],i:sum('income'),e:sum('expenses')})}
  return out;
}
function barChart(D){
  const W=640,H=230,L=44,R=8,T=14,B=30,mx=Math.max(1,...D.flatMap(m=>[m.i,m.e])),
    nice=(()=>{const p=Math.pow(10,Math.floor(Math.log10(mx)));return Math.ceil(mx/p*2)/2*p})(),
    y=v=>T+(1-v/nice)*(H-T-B),gw=(W-L-R)/D.length,bw=Math.min(26,gw/2-6);
  let g='';for(let i=0;i<=3;i++){const v=nice*i/3;g+=`<line class="gl" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end">${compact(v)}</text>`}
  let b='';D.forEach((m,i)=>{const cx=L+gw*i+gw/2;
    b+=`<rect class="bi" x="${cx-bw-2}" y="${y(m.i)}" width="${bw}" height="${Math.max(0,H-B-y(m.i))}" rx="4"><title>${fmtM(m.k)} income: ${money(m.i)}</title></rect><rect class="be" x="${cx+2}" y="${y(m.e)}" width="${bw}" height="${Math.max(0,H-B-y(m.e))}" rx="4"><title>${fmtM(m.k)} expenses: ${money(m.e)}</title></rect><text x="${cx}" y="${H-8}" text-anchor="middle">${m.l}</text>`});
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Income and expenses for the last six months">${g}${b}</svg>`;
}

<script>
'use strict';
/* ============ School branding: logo + name for every role ============ */
(()=>{
const st=document.createElement('style');
st.textContent=`
.slogo{display:inline-flex;align-items:center;justify-content:center;flex:none;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}
img.slogo{padding:2px}
.slogo.ph{background:linear-gradient(135deg,#E8A317,#C98708);color:#fff;font-weight:700;border:0}
.brand .bl .slogo{width:44px;height:44px;font-size:20px}
.schip{display:flex;align-items:center;gap:8px;padding:3px 12px 3px 3px;border:1px solid var(--line);border-radius:999px;max-width:240px}
.schip .slogo{width:30px;height:30px;border-radius:50%;font-size:14px}
.schip span{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sbanner{display:flex;align-items:center;gap:16px;margin-bottom:18px}
.sbanner h2{margin:0 0 4px}
.slogo.xl{width:84px;height:84px;font-size:36px;border-radius:16px}
.logoc .lrow{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.logoc .lrow p{margin:0}
.logoc .btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.logoc .btns .btn{margin:0}
@media(max-width:720px){.schip{padding:3px}.schip span{display:none}}
`;
document.head.appendChild(st);

const DEF_TITLE=document.title;
const initial=n=>esc((String(n||'S').trim()[0]||'S').toUpperCase());
const mark=(sc,cls)=>{
  const lg=sc&&sc.settings&&sc.settings.logo;
  return lg?`<img class="slogo ${cls||''}" src="${lg}" alt="${esc(sc.name)} logo">`
           :`<span class="slogo ph ${cls||''}" aria-hidden="true">${initial(sc&&sc.name)}</span>`;
};

/* 1. Sidebar brand + top bar chip (admin, teachers, students) */
const _shell=shell;
shell=function(inner){
  let h=_shell(inner);
  const sc=curSchool();
  if(!sc){document.title=DEF_TITLE;return h}
  document.title=sc.name+' | School Management';
  h=h.replace(/(<div class="brand"><div class="bl">)<img[^>]*>/,(m,a)=>a+mark(sc));
  return h;
};

/* 2. My account page: school banner on top */
const _prof=PAGES.profile;
PAGES.profile=function(){
  let h=_prof.apply(this,arguments);
  const sc=curSchool();
  if(!sc||S.user.role==='master')return h;
  const sub=[sc.address,sc.phone].filter(Boolean).map(esc).join(' | ');
  const card=`<div class="card sbanner">${mark(sc,'xl')}<div><h2>${esc(sc.name)}</h2>${sub?`<small class="mute">${sub}</small>`:''}</div></div>`;
  return h.replace('</h1></div><div class="two">',()=>'</h1></div>'+card+'<div class="two">');
};

/* 3. Settings: dedicated logo card with preview */
const _set=PAGES.settings;
PAGES.settings=function(){
  let h=_set.apply(this,arguments);
  const sc=curSchool(),ed=can('settings','edit'),lg=sc.settings&&sc.settings.logo;
  h=h.replace(/<label class="btn" style="margin:0">Upload logo<input[^>]*><\/label>/,'')
     .replace(/<button type="button" class="btn bad" data-a="rmLogo">Remove logo<\/button>/,'');
  const card=`<div class="card logoc"><h3 style="margin-bottom:10px">School logo</h3><div class="lrow">${mark(sc,'xl')}<div><p class="mute">${lg?'This logo appears in the sidebar, the top bar, My account and printed documents for every user of your school.':'Upload your school logo. It will appear in the sidebar, the top bar, My account and printed documents for every user of your school.'}</p>${ed?`<div class="btns"><label class="btn pri">${lg?'Change logo':'Upload logo'}<input hidden type="file" accept="image/*" data-c="logo"></label>${lg?'<button type="button" class="btn bad" data-a="rmLogo">Remove logo</button>':''}</div>`:''}</div></div></div><div style="height:16px"></div>`;
  return h.replace('<form data-s="saveSettings">',()=>card+'<form data-s="saveSettings">');
};

/* 4. Logo upload: accept any image, shrink it to fit */
INP.logo=(v,el)=>{
  const f=el.files&&el.files[0];if(!f)return;
  const sc=curSchool();if(!sc||!can('settings','edit'))return;
  if(!/^image\//.test(f.type)){toast('Please choose an image file.','bad');return}
  if(f.size>8*1024*1024){toast('Image is too large. Choose one under 8 MB.','bad');return}
  const rd=new FileReader();
  rd.onerror=()=>toast('Could not read this file.','bad');
  rd.onload=()=>{
    const im=new Image();
    im.onerror=()=>toast('Could not read this image.','bad');
    im.onload=()=>{
      const W0=im.naturalWidth||300,H0=im.naturalHeight||300,r=Math.min(1,300/Math.max(W0,H0));
      const w=Math.max(1,Math.round(W0*r)),h=Math.max(1,Math.round(H0*r));
      const cv=document.createElement('canvas');cv.width=w;cv.height=h;
      const cx=cv.getContext('2d');cx.drawImage(im,0,0,w,h);
      let out=cv.toDataURL('image/png');
      if(out.length>180*1024){cx.globalCompositeOperation='destination-over';cx.fillStyle='#fff';cx.fillRect(0,0,w,h);out=cv.toDataURL('image/jpeg',.85)}
      sc.settings=sc.settings||{};sc.settings.logo=out;save();render();toast('School logo saved.','ok');
    };
    im.src=rd.result;
  };
  rd.readAsDataURL(f);
};
ACT.rmLogo=()=>{const sc=curSchool();if(!sc||!can('settings','edit'))return;delete (sc.settings||{}).logo;save();render();toast('Logo removed.','ok')};

const _lo=ACT.logout;ACT.logout=()=>{document.title=DEF_TITLE;_lo()};
})();

<script>
'use strict';
/* ============ Mandatory profile photo for students and teachers ============ */
(()=>{
const st=document.createElement('style');
st.textContent=`
.pcap{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.pprev{width:96px;height:96px;border-radius:14px;border:2px dashed var(--line);display:grid;place-items:center;overflow:hidden;background:var(--tint);color:var(--mute);font-size:12px;text-align:center;flex:none;cursor:pointer}
.pprev.has{border-style:solid}
.pprev img{width:100%;height:100%;object-fit:cover;display:block}

.pcap .hint{flex-basis:100%;font-size:12px;color:var(--mute)}
.grid label:has(.pcap){grid-column:1/-1}

.me{display:flex;gap:18px;align-items:center;margin-bottom:18px}

.sheet .photo{overflow:hidden;padding:0}
.sheet .photo img{width:100%;height:100%;object-fit:cover;display:block}
`;
document.head.appendChild(st);

const hue=s=>{let h=0;for(const ch of String(s||''))h=(h*31+ch.charCodeAt(0))%360;return h};
const ini=n=>String(n||'?').trim().split(/\s+/).slice(0,2).map(w=>[...w][0]||'').join('').toUpperCase();
const face=(r,cls)=>r&&r.photo
  ?`<img class="av ${cls||''}" src="${r.photo}" alt="${esc(r.name)}">`
  :`<span class="av ${cls||''}" style="--h:${hue(r&&r.name)}" data-i="${esc(ini(r&&r.name))}"></span>`;
const meRec=()=>{const u=S.user;if(!u||(u.role!=='student'&&u.role!=='teacher'))return null;return byId(u.role==='student'?'students':'teachers',u.ref)||null};

/* 1. Photo field in the admission forms (required for new admissions) */
M.students.fields.unshift({k:'photo',l:'Student photo',t:'photo',req:1});
M.teachers.fields.unshift({k:'photo',l:'Teacher photo',t:'photo',req:1});
['students','teachers'].forEach(k=>{
  const m=M[k],_b=m.before;
  m.before=(r,isNew,old)=>{
    if(isNew&&!r.photo)return (k==='students'?'Student':'Teacher')+' photo is required. Choose a photo or take one with the camera.';
    return _b?_b(r,isNew,old):undefined;
  };
});
const _inp=inp;
inp=function(f,v){
  if(f.t!=='photo')return _inp(f,v);
  const who=f.l.replace(' photo','').toLowerCase();
  return `<div class="pcap"><div class="pprev ${v?'has':''}">${v?`<img src="${esc(v)}" alt="">`:'No photo yet'}</div><div class="btns"><input type="hidden" name="${f.k}" value="${esc(v||'')}"><button type="button" class="btn pri" data-a="pickPhoto">${v?'Change photo':'Choose photo'}</button><button type="button" class="btn" data-a="pickPhoto" data-cam="1">Take photo</button><input hidden type="file" accept="image/png,image/jpeg" data-c="photo"><input hidden type="file" accept="image/png,image/jpeg" capture="user" class="cam" data-c="photo"></div><div class="hint">A clear photo of the face is required. It appears on the ${who}'s profile, the records list and the admission form.</div></div>`;
};
ACT.pickPhoto=(d,el)=>{const b=el.closest('.pcap');b.querySelector(d.cam?'input.cam':'input[type=file]:not(.cam)').click()};
INP.photo=(v,el)=>{
  const f=el.files&&el.files[0];if(!f)return;
  const box=el.closest('.pcap');
  if(!/^image\/(jpeg|jpg|png)$/.test(f.type)){toast('Only JPEG, JPG or PNG picture is allowed.','bad');el.value='';return}
  if(f.size>400*1024){toast('Picture must be under 400 KB.','bad');el.value='';return}
  const rd=new FileReader();
  rd.onerror=()=>toast('Could not read this file.','bad');
  rd.onload=()=>{
    const im=new Image();
    im.onerror=()=>toast('Could not read this image.','bad');
    im.onload=()=>{
      const W=im.naturalWidth,H=im.naturalHeight,s0=Math.min(W,H),sx=(W-s0)/2,sy=(H-s0)*0.3,N=360;
      const cv=document.createElement('canvas');cv.width=cv.height=N;
      const cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,N,N);cx.drawImage(im,sx,sy,s0,s0,0,0,N,N);
      const out=cv.toDataURL('image/jpeg',.85);
      box.querySelector('input[name=photo]').value=out;
      const pv=box.querySelector('.pprev');pv.classList.add('has');pv.innerHTML=`<img src="${out}" alt="">`;
      box.querySelector('.btn.pri').textContent='Change photo';

  let h=_sh(inner);const rec=meRec();
  if(rec)h=h.replace('<div class="who">',()=>`<a class="meav" data-a="nav" data-p="profile" title="My account" tabindex="0" role="link">${face(rec)}</a><div class="who">`);

PAGES.profile=function(){
  let h=_pp.apply(this,arguments);const rec=meRec();if(!rec)return h;
  const u=S.user,line=(u.role==='student'?[rec.regNo,refText('classes',rec.classId)]:[rec.tNo,rec.subject]).filter(Boolean).map(esc).join(' | ');
  const card=`<div class="card me">${face(rec,'xxl')}<div><h2 style="margin:0 0 4px">${esc(rec.name)}</h2><div class="mute">${ROLEN[u.role]}${line?' | '+line:''}</div></div></div>`;

const trunc=(s,n=9)=>{s=String(s==null?'':s);return s.length>n?s.slice(0,n-1)+'…':s};

const IC={
 user:'<circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/>',

 id:'<rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="2"/><path d="M6 16c.6-1.6 1.8-2.4 3-2.4s2.4.8 3 2.4M14 10h4M14 14h4"/>',
 cls:'<path d="M22 10 12 5 2 10l10 5 10-5z"/><path d="M6 12v5c3 2 9 2 12 0v-5"/>',
