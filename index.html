  const a=Object.entries(map).sort((x,y)=>y[1]-x[1]).slice(0,8);if(!a.length)return '';
  const mx=Math.max(...a.map(x=>x[1]))||1;
  return `<div class="dist"><h3>${title}</h3><div class="dg">${a.map(([n,v])=>`<div class="dr"><span title="${esc(n)}">${esc(n)}</span><i><u style="width:${Math.max(4,Math.round(v/mx*100))}%"></u></i><b>${fmt?fmt(v):num(v)}</b></div>`).join('')}</div></div>`};
const group=(list,f,w)=>{const o={};list.forEach(r=>{const k=f(r)||'Other';o[k]=(o[k]||0)+(w?w(r):1)});return o};
const avatar=r=>{const ini=String(r.name||'?').trim().split(/\s+/).slice(0,2).map(w=>[...w][0]||'').join('').toUpperCase();
  return r.photo?`<span class="av ph" style="background-image:url('${r.photo}')"></span>`:`<span class="av" data-i="${esc(ini)}"></span>`};

/* ---- income / expenses ---- */
['income','expenses'].forEach(k=>{
  const m=M[k],inc=k==='income';
  m.render=Object.assign({},m.render,{
    amount:r=>`<b class="amt ${inc?'in':'out'}">${money(r.amount)}</b>`,
    category:r=>`<span class="cat c${hue(r.category)}">${esc(r.category||'')}</span>`,
    method:r=>`<span class="mt">${esc(r.method||'')}</span>`
  });
  m.top=()=>{
    if(!isAdm()&&!can(k,'view'))return '';
    const a=L(k),sum=l=>l.reduce((t,r)=>t+(+r.amount||0),0),cm=a.filter(r=>(r.date||'').slice(0,7)===mm()),pm=a.filter(r=>(r.date||'').slice(0,7)===prevMonth());
    const tc=sum(cm),tp=sum(pm),diff=tp?Math.round((tc-tp)/tp*100):null;
    const cats=group(a,r=>r.category,r=>+r.amount||0),top=Object.entries(cats).sort((x,y)=>y[1]-x[1])[0];
    return `<div class="kps">${kp('Total '+(inc?'income':'expenses'),money(sum(a)),a.length+' entr'+(a.length===1?'y':'ies'),inc?'g':'r')}${kp('This month',money(tc),cm.length+' entr'+(cm.length===1?'y':'ies'),'b')}${kp('Last month',money(tp),diff==null?'No data for comparison':(diff>=0?'This month is up ':'This month is down ')+Math.abs(diff)+'%','y')}${kp('Top category',top?esc(top[0]):'None',top?money(top[1]):'','p')}</div>${dist((inc?'Income':'Expenses')+' by category',cats,money)}`};
});

/* ---- students ---- */
{const m=M.students;
 m.render=Object.assign({},m.render,{
  name:r=>`<div class="pn">${avatar(r)}<b>${esc(r.name)}</b></div>`,
  regNo:r=>`<span class="mono">${esc(r.regNo||'')}</span>`,
  rollNo:r=>`<span class="mono">${esc(r.rollNo||'')}</span>`,
  classId:r=>`<span class="chip">${esc(refText('classes',r.classId))}</span>`});
 m.top=()=>{
  const a=L('students');if(!a.length||(S.user.role==='student'))return '';
  const act=a.filter(r=>r.status==='Active').length,nw=a.filter(r=>(r.admissionDate||'').slice(0,7)===mm()).length,gl=a.filter(r=>/^f/i.test(r.gender||'')).length,bo=a.filter(r=>/^m/i.test(r.gender||'')).length;
  return `<div class="kps">${kp('Total students',num(a.length),'All records','b')}${kp('Active',num(act),(a.length-act)+' withdrawn or passed out','g')}${kp('Boys / Girls',num(bo)+' / '+num(gl),'By gender','p')}${kp('Admitted this month',num(nw),'New admissions','y')}</div>${dist('Students by class',group(a.filter(r=>r.status==='Active'),r=>refText('classes',r.classId)))}`}}

/* ---- teachers ---- */
{const m=M.teachers;
 m.numCols=['salary'];
 m.render=Object.assign({},m.render,{
  name:r=>`<div class="pn">${avatar(r)}<b>${esc(r.name)}</b></div>`,
  tNo:r=>`<span class="mono">${esc(r.tNo||'')}</span>`,
  subject:r=>r.subject?`<span class="chip">${esc(r.subject)}</span>`:'',
  salary:r=>`<b class="amt">${money(r.salary)}</b>`});
 m.top=()=>{
  const a=L('teachers');if(!a.length||(S.user.role==='teacher'))return '';
  const act=a.filter(r=>r.status==='Active'),pay=act.reduce((t,r)=>t+(+r.salary||0),0);
  return `<div class="kps">${kp('Total teachers',num(a.length),'All records','b')}${kp('Active',num(act.length),(a.length-act.length)+' left','g')}${kp('Monthly payroll',money(pay),'Active teachers','y')}${kp('Average salary',money(act.length?Math.round(pay/act.length):0),'Per active teacher','p')}</div>${dist('Teachers by subject',group(act,r=>r.subject))}`}}

/* ---- wrap the four pages ---- */
['income','expenses','students','teachers'].forEach(k=>{
  const o=PAGES[k];if(!o)return;
  PAGES[k]=()=>`<div class="pro" data-pro="${k}">${o()}</div>`;
});
})();
</script>
