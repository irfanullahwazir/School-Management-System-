};
const colr=p=>p>=80?'#1FA855':p>=50?'#E8A317':'#D64545';
const short=v=>v>=1e6?(v/1e6).toFixed(v%1e6?1:0)+'M':v>=1e3?(v/1e3).toFixed(v%1e3?1:0)+'k':String(Math.round(v));

function barSVG(items,o={}){
  const max=o.max||100,fmt=o.fmt||(v=>Math.round(v)+'%'),cf=o.col||colr;
  const W=340,H=184,L=34,R=8,T=18,B=38,iw=W-L-R,ih=H-T-B,n=items.length,step=iw/n,bw=Math.min(40,step*.62);
  let g='';
  [0,.5,1].forEach(k=>{const y=T+ih-ih*k;g+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="currentColor" opacity=".15"/><text x="${L-5}" y="${y+3.5}" text-anchor="end" font-size="9" fill="currentColor" opacity=".6">${short(max*k)}</text>`});
  items.forEach((it,i)=>{
    const v=Math.max(0,Math.min(max,it.v)),x=L+step*i+(step-bw)/2,h=ih*v/max,y=T+ih-h;
    g+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(h,1).toFixed(1)}" rx="4" fill="${it.c||cf(it.v)}"/><text x="${(x+bw/2).toFixed(1)}" y="${(y-4).toFixed(1)}" text-anchor="middle" font-size="10" font-weight="600" fill="currentColor">${esc(fmt(it.v))}</text><text x="${(x+bw/2).toFixed(1)}" y="${H-B+14}" text-anchor="middle" font-size="9.5" fill="currentColor" opacity=".75">${esc(trunc(it.l))}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" class="spsvg" role="img" aria-label="${esc(o.label||'Chart')}">${g}</svg>`;
}
function donut(p,a,v){
  const t=p+a+v,r=46,c=2*Math.PI*r;let off=0;
  const seg=(n,col)=>{if(!n)return '';const len=c*n/t,s=`<circle cx="60" cy="60" r="${r}" fill="none" stroke="${col}" stroke-width="16" stroke-dasharray="${len.toFixed(2)} ${(c-len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 60 60)"/>`;off+=len;return s};
  return `<svg viewBox="0 0 120 120" class="spdn" role="img" aria-label="Attendance"><circle cx="60" cy="60" r="${r}" fill="none" stroke="currentColor" opacity=".12" stroke-width="16"/>${seg(p,'#1FA855')}${seg(a,'#D64545')}${seg(v,'#E8A317')}<text x="60" y="59" text-anchor="middle" font-size="21" font-weight="700" fill="currentColor">${Math.round(p/t*100)}%</text><text x="60" y="75" text-anchor="middle" font-size="9" fill="currentColor" opacity=".65">present</text></svg>`;
}
const grp=(L,key)=>{const m=new Map();L.forEach(r=>{const k=key(r),o=m.get(k)||{l:r.exam||'Exam',o:0,t:0,ts:0,date:''};o.o+=+r.obtained||0;o.t+=+r.total||0;o.ts=Math.max(o.ts,r.ts||0);o.date=r.date||o.date;m.set(k,o)});return [...m.values()].filter(x=>x.t>0).map(x=>({...x,v:x.o/x.t*100}))};
const empty=t=>`<p class="spnote">${t}</p>`;
const mlabel=k=>MON[+k.slice(5,7)-1]||k;

/* attendance card works for students (class register) and teachers */
function attCardFrom(A,id){
  A=A.filter(a=>a.marks&&a.marks[id]);
  if(!A.length)return empty('No attendance has been marked yet.');
  let p=0,a=0,v=0;const mo={};
  A.forEach(x=>{const m=x.marks[id],k=x.date.slice(0,7);mo[k]=mo[k]||{p:0,t:0};mo[k].t++;if(m==='A')a++;else if(m==='V')v++;else{p++;mo[k].p++}});
  const months=Object.keys(mo).sort().slice(-6).map(k=>({l:mlabel(k),v:mo[k].p/mo[k].t*100}));
  return `<div class="sprow">${donut(p,a,v)}<div class="spleg"><div><i style="background:#1FA855"></i>Present: <b>${p}</b></div><div><i style="background:#D64545"></i>Absent: <b>${a}</b></div><div><i style="background:#E8A317"></i>Leave: <b>${v}</b></div><div class="mute">${p+a+v} days marked</div></div></div><p class="spnote">Present % by month</p>${barSVG(months,{label:'Monthly attendance'})}`;
}
function resCard(rec){
  const R=rows('results').filter(r=>r.studentId===rec.id&&+r.total);
  if(!R.length)return empty('No exam results have been entered yet.');
  const ex=grp(R,r=>r.exam).sort((a,b)=>a.ts-b.ts).slice(-8),last=ex[ex.length-1];
  const subs=R.filter(r=>r.exam===last.l).map(r=>({l:refText('subjects',r.subjectId)||'Subject',v:(+r.obtained||0)/(+r.total)*100}));
  const avg=ex.reduce((s,x)=>s+x.v,0)/ex.length;
  return `<div class="spstat"><div><b>${Math.round(avg*10)/10}%</b>Average (${esc(grade(avg))})</div><div><b>${Math.round(last.v*10)/10}%</b>Latest: ${esc(trunc(last.l,16))}</div></div><p class="spnote">Result % by exam</p>${barSVG(ex,{label:'Exam results'})}<p class="spnote">Subjects in ${esc(last.l)}</p>${subs.map(s=>`<div class="hb"><span title="${esc(s.l)}">${esc(s.l)}</span><div class="tr"><i style="width:${Math.min(100,s.v).toFixed(1)}%;background:${colr(s.v)}"></i></div><b>${Math.round(s.v)}%</b></div>`).join('')}`;
}
function tstCard(rec){
  const R=rows('tests').filter(r=>r.studentId===rec.id&&+r.total);
  if(!R.length)return empty('No class test marks have been entered yet.');
  const T=grp(R,r=>r.exam+'|'+(r.date||'')).sort((a,b)=>(a.date||'').localeCompare(b.date||'')||a.ts-b.ts).slice(-8);
  const avg=T.reduce((s,x)=>s+x.v,0)/T.length;
  return `<div class="spstat"><div><b>${Math.round(avg*10)/10}%</b>Average (${esc(grade(avg))})</div><div><b>${T.length}</b>Tests shown</div></div><p class="spnote">Marks % by class test</p>${barSVG(T,{label:'Class test results'})}`;
}
function feeTable(rec){
  const F=rows('fees').filter(f=>f.studentId===rec.id).sort((a,b)=>(b.month||'').localeCompare(a.month||''));
  if(!F.length)return empty('No fee records yet.');
  const net=F.reduce((s,f)=>s+fnet(f),0),paid=F.reduce((s,f)=>s+(Number(f.paid)||0),0),pend=Math.max(0,net-paid);
  return `<div class="spstat"><div><b>${esc(money(paid))}</b>Collected</div><div><b>${esc(money(pend))}</b>Pending</div><div><b>${esc(money(net))}</b>Total billed</div></div>
   <div class="spl"><span><i style="background:#1FA855"></i>Collected</span><span><i style="background:#D64545"></i>Pending</span></div>
   ${barSVG(F.slice(0,8).reverse().map(f=>({l:(f.type||'Fee').slice(0,4)+' '+mlabel(f.month||'0000-00'),v:fnet(f),c:fbal(f)<=0?'#1FA855':'#D64545'})),{max:Math.max(1,...F.slice(0,8).map(fnet)),fmt:short,col:()=>'#1FA855',label:'Fees by month'})}
   <table class="sptb"><thead><tr><th>Month</th><th>Type</th><th class="r">Net</th><th class="r">Paid</th><th class="r">Balance</th></tr></thead><tbody>${F.slice(0,10).map(f=>`<tr><td>${esc(fmtM(f.month))}</td><td>${esc(f.type||'')}</td><td class="r">${esc(money(fnet(f)))}</td><td class="r">${esc(money(f.paid))}</td><td class="r">${esc(money(fbal(f)))}</td></tr>`).join('')}</tbody></table>`;
}
function salCard(rec,admin){
  const L=rows('salaries').filter(s=>s.teacherId===rec.id).sort((a,b)=>(a.month||'').localeCompare(b.month||''));
  if(!L.length)return empty('No salary records yet.');
  const paid=L.filter(s=>s.status==='Paid').reduce((a,s)=>a+(+s.net||0),0),unpaid=L.filter(s=>s.status!=='Paid').reduce((a,s)=>a+(+s.net||0),0);
  const last=L.slice(-8);
  return `<div class="spstat"><div><b>${esc(money(paid))}</b>Received</div><div><b>${esc(money(unpaid))}</b>Not yet paid</div><div><b>${esc(money(rec.salary))}</b>Monthly salary</div></div>
   <div class="spl"><span><i style="background:#1FA855"></i>Paid</span><span><i style="background:#D64545"></i>Unpaid</span></div>
   ${barSVG(last.map(s=>({l:mlabel(s.month||'0000-00')+(s.month?"'"+s.month.slice(2,4):''),v:+s.net||0,c:s.status==='Paid'?'#1FA855':'#D64545'})),{max:Math.max(1,...last.map(s=>+s.net||0)),fmt:short,col:()=>'#1FA855',label:'Salary by month'})}
   ${admin?`<table class="sptb"><thead><tr><th>Month</th><th class="r">Net pay</th><th class="r">Status</th></tr></thead><tbody>${[...L].reverse().slice(0,10).map(s=>`<tr><td>${esc(fmtM(s.month))}</td><td class="r">${esc(money(s.net))}</td><td class="r">${esc(s.status==='Paid'?'Paid '+fmtD(s.paidDate):'Unpaid')}</td></tr>`).join('')}</tbody></table>`:''}`;
}
function ttCard(rec){
  const L=rows('timetable').filter(r=>r.teacherId===rec.id);
  if(!L.length)return empty('No periods are assigned to this teacher yet.');
  const ps=[...new Set(L.map(r=>r.period))].sort((a,b)=>a-b);
  return `<div style="overflow-x:auto;padding-bottom:3px"><table class="sptt"><thead><tr><th>Day</th>${ps.map(p=>`<th>Period ${p}</th>`).join('')}</tr></thead><tbody>${DAYS.filter(d=>L.some(r=>r.day===d)).map(d=>`<tr><th>${esc(d)}</th>${ps.map(p=>`<td>${L.filter(x=>x.day===d&&x.period===p).map(r=>`<b>${esc(refText('classes',r.classId))}</b><small>${esc(refText('subjects',r.subjectId))}${r.start?' · '+esc(r.start)+(r.end?'-'+esc(r.end):''):''}</small>`).join('')}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}

const row=(ic,l,v,extra)=>`<div class="spi"><div class="ic">${ico(IC[ic])}</div><div class="tx"><small>${l}</small><b>${v===''||v==null?'<span class="mute">Not added</span>':v}</b>${extra?`<em>${extra}</em>`:''}</div></div>`;

const photoOf=rec=>rec.photo?`<img src="${rec.photo}" alt="${esc(rec.name)}">`:`<span class="av" style="--h:${hueOf(rec.name)}" data-i="${esc(iniOf(rec.name))}"></span>`;

}
function studentProfileHTML(rec,mode,tail){
  const self=mode==='self',adm=!self,sc=curSchool(),cls=refText('classes',rec.classId),un=self?S.user.username:userOf(rec,'student').username;

    const F=rows('fees').filter(f=>f.studentId===rec.id),net=F.reduce((s,f)=>s+fnet(f),0),paid=F.reduce((s,f)=>s+(Number(f.paid)||0),0),bal=net-paid;
    fees=row('money','Fees',F.length?(bal>0?esc(money(bal))+' due':'All paid'):'No fee records',F.length?`Paid ${esc(money(paid))} of ${esc(money(net))}`:'');
  }

    row('cls','Class',esc(cls))+row('phone','Phone Number',esc(rec.phone))+row('mail','Email',esc(rec.email))+
    row('pin','Address',esc(rec.address))+row('cake','Date of Birth',rec.dob?esc(fmtD(rec.dob)):'')+row('key','Username',esc(un))+(S.user.role==='admin'||S.user.role==='master'?row('key','Password',esc(userOf(rec,'student').initPw||'Not saved - use Reset password')):'')+

INP.myPhoto=(v,el)=>{
  const rec=mine(),f=el.files&&el.files[0];if(!rec||!f)return;
  if(!/^image\/(jpeg|jpg|png)$/.test(f.type)){toast('Only JPEG, JPG or PNG picture is allowed.','bad');el.value='';return}
  if(f.size>400*1024){toast('Picture must be under 400 KB.','bad');el.value='';return}
  const rd=new FileReader();
  rd.onerror=()=>toast('Could not read this file.','bad');
  rd.onload=()=>{
    const im=new Image();
    im.onerror=()=>toast('Could not read this image.','bad');
    im.onload=()=>{
      const W=im.naturalWidth,H=im.naturalHeight,s0=Math.min(W,H),sx=(W-s0)/2,sy=(H-s0)*.3,N=360;
      const cv=document.createElement('canvas');cv.width=cv.height=N;
      const cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,N,N);cx.drawImage(im,sx,sy,s0,s0,0,0,N,N);
      rec.photo=cv.toDataURL('image/jpeg',.85);
      save();closeSp();render();toast('Profile photo updated.','ok');
    };
    im.src=rd.result;
  };
  rd.readAsDataURL(f);
};

  const size=ver*4+17,m=[],fn=[];

    let p=0;

    for(let x=0;x<size;x++)line(m.map(r=>r[x]));

/* ---- scan / verify a card (shows photo and details) ---- */
const vqCard=(k,p,scanned)=>{
  const sc=curSchool()||{},lg=lgOf(),ini=String(p.name||'?').trim().split(/\s+/).slice(0,2).map(w=>[...w][0]||'').join('').toUpperCase();
  const first=String(scanned||'').split('\n')[0].trim(),other=first&&sc.name&&first!==sc.name&&/\n/.test(scanned);
  const det=(k==='s'?[['Reg. ID',p.regNo],["Father's name",p.fatherName],['Class',refText('classes',p.classId)],['Roll no.',p.rollNo],['Gender',p.gender],['Date of birth',p.dob?fmtD(p.dob):''],['Phone',p.phone],['Address',p.address]]:[['Registration no.',p.tNo],["Father's name",p.fatherName],['Subject',p.subject],['Qualification',p.qualification],['ID Card No.',p.idNo],['Gender',p.gender],['Date of birth',p.dob?fmtD(p.dob):''],['Phone',p.phone],['Address',p.address]]).filter(x=>x[1]&&x[1]!=='—');
  const active=p.status==='Active';
  return `${other?`<div class="note" style="margin:10px 0">This QR code names a different school ("${esc(first)}"). Check the card carefully.</div>`:''}<div class="vqc"><div class="vqh">${lg?`<img src="${lg}" alt="">`:`<span class="cilg">${esc((sc.name||'S')[0].toUpperCase())}</span>`}<div><b>${esc(sc.name)}</b><small>${k==='s'?'STUDENT':'TEACHER'} CARD</small></div></div><div class="ntd" style="padding:12px"><div class="cip big">${p.photo?`<img src="${p.photo}" alt="">`:esc(ini)}</div><div><h3 style="margin:0 0 4px">${esc(p.name)}</h3>${tag(active?'Active':p.status||'Inactive',active?'ok':'bad')}</div></div><div style="padding:0 12px 12px">${det.map(([a,v])=>led(a,esc(v))).join('')}</div></div>`;
};
function verifyLookup(t){
  t=String(t||'').trim();if(!t)return '<p class="mute">Type an ID or scan a QR code.</p>';
  const m=/(?:Reg ID|Teacher No)\s*:\s*([^\s\n]+)/i.exec(t),key=(m?m[1]:t).toLowerCase();
  const s=rows('students').find(x=>String(x.regNo||'').toLowerCase()===key),tc=rows('teachers').find(x=>String(x.tNo||'').toLowerCase()===key);
  if(s)return vqCard('s',s,m?t:'');if(tc)return vqCard('t',tc,m?t:'');
  return '<div class="note" style="margin:10px 0"><b>Not found.</b> No student or teacher with this ID in this school. The card may belong to another school or may not be real.</div>';
}
ACT.cdScan=()=>{
  const {el}=openModal({title:'Scan / verify card',foot:true,html:`<p class="mute" style="margin-top:0">Scan the QR code on a card, or type the Reg. ID / Teacher no. The photo and full details are shown from your school records.</p><div class="vqv" id="vqv" hidden><video id="vqvid" playsinline muted></video></div><div style="display:flex;gap:8px;flex-wrap:wrap;margin:10px 0"><button type="button" class="btn" data-a="vqStart">Open camera</button></div><div style="display:flex;gap:8px"><input id="vqin" placeholder="e.g. STD-0001" autocomplete="off" aria-label="ID" style="flex:1"><button type="button" class="btn pri" data-a="vqFind">Find</button></div><div id="vqres"></div>`});
  const go=()=>{el.querySelector('#vqres').innerHTML=verifyLookup(el.querySelector('#vqin').value)};
  el.querySelector('#vqin').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();go()}});
  el._vqGo=go;
};
ACT.vqFind=(d,b)=>{const el=b.closest('.ov');if(el&&el._vqGo)el._vqGo()};
ACT.vqStart=async(d,b)=>{
  const el=b.closest('.ov');if(!el)return;
  if(!('BarcodeDetector' in window)||!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){toast('Camera scanning is not supported in this browser. Scan with your phone camera and type the ID here.','bad');return}
  try{
    const det=new BarcodeDetector({formats:['qr_code']}),stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    const v=el.querySelector('#vqvid'),box=el.querySelector('#vqv');v.srcObject=stream;box.hidden=false;await v.play();
    const stop=()=>stream.getTracks().forEach(t=>t.stop());
    const tick=async()=>{
      if(!v.isConnected){stop();return}
      try{const c=await det.detect(v);if(c.length){stop();box.hidden=true;const raw=c[0].rawValue;const inp=el.querySelector('#vqin');inp.value=(/(?:Reg ID|Teacher No)\s*:\s*([^\s\n]+)/i.exec(raw)||[])[1]||raw;el.querySelector('#vqres').innerHTML=verifyLookup(raw);return}}catch(e){}
      setTimeout(tick,250);
    };
    tick();
  }catch(e){toast('Could not open the camera. Allow camera access, or type the ID.','bad')}
};

/* ---------- 4. dashboard (admin and staff) ---------- */
const ring=(segs,ctr)=>{
  const r=34,c=2*Math.PI*r,t=segs.reduce((a,s)=>a+s.n,0);let off=0,g=`<circle cx="42" cy="42" r="${r}" fill="none" stroke="currentColor" opacity=".12" stroke-width="10"/>`;
  if(t>0)segs.forEach(s=>{if(!s.n)return;const len=c*s.n/t;g+=`<circle cx="42" cy="42" r="${r}" fill="none" stroke="${s.c}" stroke-width="10" stroke-dasharray="${len.toFixed(2)} ${(c-len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 42 42)"/>`;off+=len});
  return `<svg viewBox="0 0 84 84" class="dkr" role="img" aria-label="${esc(ctr)}">${g}<text x="42" y="46.5" text-anchor="middle" font-size="14" font-weight="700" fill="currentColor">${esc(ctr)}</text></svg>`;
};
function lineSVG(pts){
  const W=340,H=176,L=30,R=12,T=14,B=30,iw=W-L-R,ih=H-T-B,n=pts.length,x=i=>L+(n===1?iw/2:iw*i/(n-1)),y=v=>T+ih-ih*v/100;
  let g='';[0,50,100].forEach(v=>{g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="currentColor" opacity=".15"/><text x="${L-5}" y="${y(v)+3.5}" text-anchor="end" font-size="9" fill="currentColor" opacity=".6">${v}</text>`});
  const line=pts.map((p,i)=>`${i?'L':'M'}${x(i).toFixed(1)} ${y(p.v).toFixed(1)}`).join(' ');
  g+=`<path d="${line} L${x(n-1).toFixed(1)} ${y(0)} L${x(0).toFixed(1)} ${y(0)} Z" class="ar" fill="#128C7E" opacity=".14"/><path class="ln" pathLength="1" d="${line}" fill="none" stroke="#128C7E" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
  const stp=Math.ceil(n/6);
  pts.forEach((p,i)=>{g+=`<circle cx="${x(i).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="3.5" fill="#128C7E"><title>${esc(p.l)}: ${Math.round(p.v)}%</title></circle>`;if(i%stp===0||i===n-1)g+=`<text x="${x(i).toFixed(1)}" y="${H-B+14}" text-anchor="middle" font-size="9.5" fill="currentColor" opacity=".7">${esc(p.l)}</text>`});
  return `<svg viewBox="0 0 ${W} ${H}" class="spsvg" role="img" aria-label="Attendance trend">${g}</svg>`;

function ieSVG(months){

  months.forEach((m,i)=>{const cx=L+step*i+step/2;[[m.i,'#1FA855',-bw-1],[m.e,'#D64545',1]].forEach(([v,c,dx])=>{const h=ih*v/mx,y=T+ih-h;g+=`<rect x="${(cx+dx).toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(h,v?1:0).toFixed(1)}" rx="3" class="bar" style="--i:${i}" fill="${c}"/>${v?`<text x="${(cx+dx+bw/2).toFixed(1)}" y="${(y-3).toFixed(1)}" text-anchor="middle" font-size="8" fill="currentColor">${short(v)}</text>`:''}`});g+=`<text x="${cx.toFixed(1)}" y="${H-B+14}" text-anchor="middle" font-size="9.5" fill="currentColor" opacity=".75">${esc(m.l)}</text>`});

 ['dashboard','Dashboard',['dashboard']],['notifs','Notifications',['notifs']],['mynotes','Notifications',['mynotes']],['students','Students',['students']],['teachers','Teachers',['teachers']],

const hueOf=s=>{let x=0;for(const c of s||'')x=(x*31+c.charCodeAt(0))%360;return x};
const _shell4=shell;
shell=function(inner){

};

const crcT=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();

function zip(files){const enc=new TextEncoder(),parts=[],cd=[];let off=0;
  const w=(a,v,n)=>{for(let i=0;i<n;i++)a.push((v>>>(8*i))&255)};
  files.forEach(f=>{const nm=enc.encode(f.name),d=enc.encode(f.data),c=crc(d),h=[];
    w(h,0x04034b50,4);w(h,20,2);w(h,0x0800,2);w(h,0,2);w(h,0,2);w(h,0x21,2);w(h,c,4);w(h,d.length,4);w(h,d.length,4);w(h,nm.length,2);w(h,0,2);
    parts.push(new Uint8Array(h),nm,d);
    const e=[];w(e,0x02014b50,4);w(e,20,2);w(e,20,2);w(e,0x0800,2);w(e,0,2);w(e,0,2);w(e,0x21,2);w(e,c,4);w(e,d.length,4);w(e,d.length,4);w(e,nm.length,2);w(e,0,2);w(e,0,2);w(e,0,2);w(e,0,2);w(e,0,4);w(e,off,4);
    cd.push(new Uint8Array(e),nm);off+=h.length+nm.length+d.length});
  const cs=cd.reduce((a,x)=>a+x.length,0),end=[];w(end,0x06054b50,4);w(end,0,2);w(end,0,2);w(end,files.length,2);w(end,files.length,2);w(end,cs,4);w(end,off,4);w(end,0,2);
  return new Blob([...parts,...cd,new Uint8Array(end)],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'})}

   {name:'_rels/.rels',data:`<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`},
   {name:'xl/workbook.xml',data:`<?xml version="1.0" encoding="UTF-8"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${T.map((t,i)=>`<sheet name="${X(t.name)}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join('')}</sheets></workbook>`},
   {name:'xl/_rels/workbook.xml.rels',data:`<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${T.map((t,i)=>`<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join('')}</Relationships>`},

const hwTag=v=>v==='done'?tag('Done','ok'):v==='not'?tag('Not done','bad'):tag('Not checked','warn');
function hwCheckPage(){
  const stu=isStu(),mark=canMark();
  const cf=stu?'':(S.ctx.hwC||''),sf=S.ctx.hwS||'',sd=stu?'':(S.ctx.hwStu||''),st=S.ctx.hwSt||'',day=S.ctx.hwDay||'';
  const names=[...new Map(rows('subjects').filter(x=>!cf||x.classId===cf).map(x=>[String(x.name).trim().toLowerCase(),String(x.name).trim()])).values()].sort((a,b)=>a.localeCompare(b));
  const L=scope('homework',rows('homework')).filter(h=>(!cf||h.classId===cf)&&(!sf||subName(h.subjectId).toLowerCase()===sf.toLowerCase())&&ymFilter('hw',h.date)&&(!day||h.date===day)).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  let D=0,N=0,P=0,HW=0;
  const want={done:'done',not:'not',none:''};
  const cards=L.map(h=>{
    let R=scope('students',activeStudents()).filter(s=>s.classId===h.classId).sort(rollSort);
    if(sd)R=R.filter(s=>s.id===sd);
    let V=R.map(s=>({s,v:hwStat(h,s)}));
    if(st)V=V.filter(x=>x.v===want[st]);
    if(!V.length)return '';
    const dn=V.filter(x=>x.v==='done').length,nt=V.filter(x=>x.v==='not').length,pd=V.length-dn-nt;
    D+=dn;N+=nt;P+=pd;HW++;
    return `<div class="card flush" style="margin-bottom:14px"><div class="mh" style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center"><div><b>${esc(h.title)}</b><br><small class="mute">${esc(refText('classes',h.classId))} | ${esc(subName(h.subjectId)||'-')} | Assigned ${esc(fmtD(h.date))} | Due ${esc(fmtD(h.dueDate))}</small></div><div class="acts">${tag('Done '+dn,'ok')} ${tag('Not done '+nt,'bad')} ${tag('Not checked '+pd,'warn')}${mark?` <button class="btn sm" data-a="hwAll" data-h="${h.id}">Mark all done</button>`:''}</div></div><div class="tw"><table><thead><tr><th>Roll</th><th>Student</th><th>Status</th>${mark?'<th></th>':''}</tr></thead><tbody>${V.map(({s,v})=>`<tr><td>${esc(s.rollNo||'')}</td><td>${esc(s.name)}</td><td>${hwTag(v)}</td>${mark?`<td class="acts"><button class="btn sm ${v==='done'?'pri':''}" data-a="hwMark" data-h="${h.id}" data-s="${s.id}" data-v="1">Done</button><button class="btn sm ${v==='not'?'bad':''}" data-a="hwMark" data-h="${h.id}" data-s="${s.id}" data-v="0">Not done</button></td>`:''}</tr>`).join('')}</tbody></table></div></div>`}).join('');
  const sel=(c,lbl,all,o,cur)=>`<select data-c="${c}" aria-label="${lbl}"><option value="">${all}</option>${o.map(([a,b])=>`<option value="${esc(a)}" ${a===cur?'selected':''}>${esc(b)}</option>`).join('')}</select>`;
  const stuL=scope('students',activeStudents()).filter(s=>!cf||s.classId===cf).sort(rollSort).map(s=>[s.id,(s.rollNo?s.rollNo+'. ':'')+s.name]);
  const box=(l,v)=>`<div class="note"><div class="mute" style="font-size:12px">${l}</div><b>${v}</b></div>`;
  return `<div class="head"><h1>Check Homework</h1><div class="tools"><button class="btn" data-a="hwTab" data-t="list">Back to Homework</button></div></div>
  <div class="card" style="margin-bottom:14px">${ymBar('hw')}<div class="hwf">${stu?'':sel('hwC','Class','All classes',opts({t:'ref',ref:'classes'}),cf)}${sel('hwS','Subject','All subjects',names.map(n=>[n,n]),sf)}${stu?'':sel('hwStu','Student','All students',stuL,sd)}${sel('hwSt','Status','All status',[['done','Done'],['not','Not done'],['none','Not checked']],st)}<input type="date" data-c="hwDay" value="${esc(day)}" style="width:auto" aria-label="Day">${day?'<button class="btn sm" data-a="hwClr">Clear day</button>':''}</div></div>
  <div class="hwsum">${box('Homework',HW)}${box('Done',D)}${box('Not done',N)}${box('Not checked',P)}</div>
  ${cards||'<div class="card"><div class="empty"><b>No homework found</b>Change the class, subject, month, day or student filter.</div></div>'}`;
}
{const o=PAGES.homework;
 PAGES.homework=function(){
  if(S.ctx.hwTab==='check')return hwCheckPage();
  const h=o.apply(this,arguments),btn='<button class="btn" data-a="hwTab" data-t="check">Check Homework</button>',k='<button class="btn pri" data-a="add" data-k="homework">';
  return h.includes(k)?h.replace(k,()=>btn+k):h.replace('<div class="tools">',()=>'<div class="tools">'+btn);
 }}
ACT.hwTab=d=>{S.ctx.hwTab=d.t==='check'?'check':'list';render();window.scrollTo(0,0)};
ACT.hwMark=d=>{
  if(!canMark())return;const h=byId('homework',d.h),s=byId('students',d.s);if(!h||!s)return;
  const v=d.v==='1';DB.c.hwcheck=DB.c.hwcheck||[];
  const r=rows('hwcheck').find(x=>x.hwId===h.id&&x.studentId===s.id);
  if(r&&r.done===v)DB.c.hwcheck=DB.c.hwcheck.filter(x=>x!==r);
  else if(r){r.done=v;r.date=today()}
  else DB.c.hwcheck.push({id:uid(),sid:S.sid,ts:Date.now(),hwId:h.id,studentId:s.id,done:v,date:today()});
  save();render();
};
ACT.hwAll=d=>{
  if(!canMark())return;const h=byId('homework',d.h);if(!h)return;DB.c.hwcheck=DB.c.hwcheck||[];
  activeStudents().filter(s=>s.classId===h.classId).forEach(s=>{
    const r=rows('hwcheck').find(x=>x.hwId===h.id&&x.studentId===s.id);
    if(r){r.done=true;r.date=today()}else DB.c.hwcheck.push({id:uid(),sid:S.sid,ts:Date.now(),hwId:h.id,studentId:s.id,done:true,date:today()});
  });
  save();render();toast('All students marked as done.','ok');
};
INP.hwC=v=>{S.ctx.hwC=v;S.ctx.hwS='';S.ctx.hwStu='';render()};
INP.hwS=v=>{S.ctx.hwS=v;render()};
INP.hwStu=v=>{S.ctx.hwStu=v;render()};
INP.hwSt=v=>{S.ctx.hwSt=v;render()};
INP.hwDay=v=>{S.ctx.hwDay=v;if(v){S.ctx.hwY=+v.slice(0,4);S.ctx.hwM=+v.slice(5,7)-1}render()};
ACT.hwClr=()=>{S.ctx.hwDay='';render()};
{const y1=ACT.ymY,m1=ACT.ymM;ACT.ymY=d=>{if(d.k==='hw')S.ctx.hwDay='';y1(d)};ACT.ymM=d=>{if(d.k==='hw')S.ctx.hwDay='';m1(d)}}
{const n0=ACT.nav;if(n0)ACT.nav=d=>{S.ctx.hwTab='list';n0(d)}}

/* subjects: edit and delete */
ACT.subEdit=d=>{
  if(!can('subjects','edit'))return;const old=d.n,lo=old.toLowerCase();
  openModal({title:'Edit subject',saveLabel:'Save',html:`<form class="grid"><label class="full"><span>Subject name *</span><input name="name" value="${esc(old)}" required></label></form>`,
    save:(close,el)=>{const f=el.querySelector('form');if(!f.reportValidity())return;const nn=f.name.value.trim();if(!nn)return;
      if(nn.toLowerCase()!==lo&&subjectNames().some(x=>x.toLowerCase()===nn.toLowerCase())){toast('This subject already exists.','bad');return}
      [...rows('subjcat'),...rows('subjects')].forEach(r=>{if(String(r.name||'').trim().toLowerCase()===lo)r.name=nn});
      save();close();render();toast('Subject updated.','ok')}});
};
ACT.subDel=async d=>{
  if(!can('subjects','delete'))return;const n=d.n,lo=n.toLowerCase();
  const ids=rows('subjects').filter(x=>String(x.name||'').trim().toLowerCase()===lo).map(x=>x.id);
  const used=['timetable','homework','tests','results','examtt','tdefs'].some(k=>rows(k).some(r=>ids.includes(r.subjectId)));
  if(!await ask(`Delete subject "${n}" from all classes?`+(used?' It is already used in timetable, homework, exam or marks records.':''),'Delete'))return;
  DB.c.subjects=DB.c.subjects.filter(x=>!(x.sid===S.sid&&ids.includes(x.id)));
  DB.c.subjcat=DB.c.subjcat.filter(x=>!(x.sid===S.sid&&String(x.name||'').trim().toLowerCase()===lo));
  save();render();toast('Subject deleted.');
};
})();

/* ---------- login / register / forgot ---------- */
const lv=loginView;
loginView=function(){
  let h=lv();const d=dev();
  h=h.replace('<div class="auth">',`<div class="auth ${d}">`);
  h=h.replace('<div class="by">@IUCS Master</div>','<div class="by">@IUCS Master</div><ul class="feat"><li>Admissions &amp; ID cards</li><li>Attendance, fees &amp; salary</li><li>Exams, results &amp; certificates</li><li>Notices &amp; messages</li></ul>');
  const L=(n,l,t='text',x='')=>`<label><span>${l}</span><input name="${n}" type="${t}" required ${x}></label>`;
  if(S.auth==='register')h=h.replace(/<form data-s="register">[\s\S]*?<\/form>/,`<form data-s="register">${L('name','School Name')}${L('phone','Phone No','tel')}${L('email','Email Address','email')}${L('admin','School Admin Full Name')}${L('username','Admin Username','text','autocomplete="off"')}${L('password','Password (at least 6 characters)','password','minlength="6"')}<div class="err" id="aerr"></div><button class="btn pri">Register School</button></form>`);
  if(S.auth==='forgot')h=h.replace(/<form data-s="forgot">[\s\S]*?<\/form>/,`<form data-s="forgot">${L('username','Username')}${L('reg','School Registration ID')}${L('phone','Phone number on your account','tel')}${L('email','Email on your account','email')}<label><span>Send confirmation code to</span><select name="via"><option value="phone">Phone number</option><option value="email">Email address</option></select></label><div class="err" id="aerr"></div><button class="btn pri">Send confirmation code</button></form>`);
  return h;
};
let lastDev=dev();addEventListener('resize',()=>{const d=dev();document.documentElement.dataset.device=d;if(d!==lastDev){lastDev=d;if(!S.user)render()}});
const dg=s=>String(s||'').replace(/\D/g,''),maskP=p=>'*'.repeat(Math.max(0,dg(p).length-3))+dg(p).slice(-3),maskE=e=>e.replace(/^(.{2})[^@]*(@.*)$/,'$1***$2');
SUB.forgot=f=>{
  const d=Object.fromEntries(new FormData(f)),sc=DB.schools.find(s=>s.regId===d.reg.trim().toUpperCase());
  const u=sc&&DB.users.find(x=>x.sid===sc.id&&x.username.toLowerCase()===d.username.trim().toLowerCase());
  const em=String(u&&(u.email||(u.role==='admin'?sc.email:''))||'').trim().toLowerCase();
  if(!u||!dg(d.phone)||dg(u.phone)!==dg(d.phone)||!em||em!==d.email.trim().toLowerCase())return aerr('Username, Registration ID, phone number and email do not match any account.');
  let code=String(100000+crypto.getRandomValues(new Uint32Array(1))[0]%900000),exp=Date.now()+600000,tries=0;
  const to=d.via==='email'?maskE(em):maskP(u.phone);
  openModal({title:'Confirmation code',saveLabel:'Reset password',html:`<p style="margin-top:0">A 6-digit code was prepared for <b>${esc(to)}</b>. It is valid for 10 minutes.</p><div class="mdemo"><b>Demo mode:</b> no SMS/email gateway is connected, so your code is <b>${code}</b></div><form class="grid"><label class="full"><span>Confirmation code</span><input name="c" inputmode="numeric" maxlength="6" required></label><label class="full"><span>New password (at least 6 characters)</span><input name="p" type="password" minlength="6" required></label><label class="full"><span>Confirm new password</span><input name="p2" type="password" minlength="6" required></label></form>`,
  save:(close,el)=>{const fm=el.querySelector('form');if(!fm.reportValidity())return;
    if(Date.now()>exp){toast('This code has expired. Start again.','bad');close();return}
    if(fm.c.value.trim()!==code){tries++;if(tries>=3){close();toast('Too many wrong codes. Start again.','bad');return}toast('Wrong code. '+(3-tries)+' tries left.','bad');return}
    if(fm.p.value!==fm.p2.value){toast('Passwords do not match.','bad');return}
    u.pass=hash(fm.p.value);CP(u,fm.p.value);save();close();S.auth='login';S.ctx.prefill={u:u.username,p:''};render();toast('Password reset. Sign in with the new password.','ok')}});
};

4"/>','School Settings':'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/>','About':P+'<path d="M12 11v6M12 7.5h.01"/>'};

/* ---------- sound centre ---------- */
let AC=null;
const LIB={off:['No sound',[]],win7:['Windows 7',[[523,.16],[659,.16],[784,.16],[1047,.5]]],win8:['Windows 8',[[392,.1,.2,'triangle'],[523,.1,.2,'triangle'],[659,.1,.2,'triangle'],[784,.35,.2,'triangle']]],win10:['Windows 10',[[698,.12],[880,.12],[1175,.4]]],win11:['Windows 11',[[880,.1,.15],[1318,.5,.15]]],werr:['Windows Error',[[300,.2,.2,'square'],[220,.38,.2,'square']]],fbpop:['Facebook Pop',[[1200,.05],[800,.09]]],fbnote:['Facebook Notification',[[988,.08],[1319,.08],[1760,.24]]],chime:['Chime',[[1046,.2],[1568,.45]]],bell:['Bell',[[1320,.35,.18],[990,.5,.15]]],ding:['Ding',[[880,.2],[1320,.3]]],soft:['Soft',[[520,.18,.12],[650,.25,.12]]]};
const EV=[['login','Login'],['wrong','Wrong password'],['save','Data save'],['notice','School Notice post'],['notif','New notification']];
const DEF={login:'win11',wrong:'werr',save:'ding',notice:'fbpop',notif:'fbnote'};
function play(name){
  if(LSG('sms-snd')==='0')return;const seq=(LIB[name]||[0,[]])[1];if(!seq.length)return;
  try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();let t=AC.currentTime+.01;
  seq.forEach(([f,d,v,ty])=>{const o=AC.createOscillator(),g=AC.createGain();o.type=ty||'sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v||.2,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.03);t+=d*.85})}catch(e){}
}
const roleKey=u=>u&&u.role==='teacher'?'teacher':u&&u.role==='student'?'student':'admin';
const cfgFor=(sid,r)=>{const sc=DB.schools.find(s=>s.id===sid);return Object.assign({},DEF,sc&&sc.sounds&&sc.sounds[r]||{})};
function fire(ev,u){u=u||S.user;if(!u)return;play(cfgFor(u.sid,roleKey(u))[ev])}
const t1=toast;
toast=function(m,t){
  const k=LSG('sms-snd');try{localStorage.setItem('sms-snd','0')}catch(e){}
  try{t1(m,t)}finally{try{k==null?localStorage.removeItem('sms-snd'):localStorage.setItem('sms-snd',k)}catch(e){}}
  m=String(m);
  if(m==='Account login successful')return fire('login');
  if(t==='bad'){let u=S.user;if(!u){const i=$q('input[name=username]');u=i&&DB.users.find(x=>x.username.toLowerCase()===i.value.trim().toLowerCase())}return u?fire('wrong',u):play(DEF.wrong)}
  if(/notice/i.test(m)&&/posted/i.test(m))return fire('notice');

{const l0=SUB.login;SUB.login=f=>{const u0=S.user;l0(f);if(!S.user&&!u0){const e=$q('#aerr');if(e&&e.textContent){const i=f.username&&DB.users.find(x=>x.username.toLowerCase()===f.username.value.trim().toLowerCase());i?fire('wrong',i):play(DEF.wrong)}}else if(S.user&&!u0)fire('login')}}

<script>

const st=document.createElement('style');st.textContent=`

/* ---------- master credentials + login by username / email / phone ---------- */
function migrate(){const m=master();if(m&&!m.v14){m.username='IrfanAaliyaUllah';m.email='irfanullahwaziri30@gmail.com';m.phone='+92 336 8880997 / +93 70 6254009';m.pass=hash('Irfan123');m.v14=1;save()}}

PAGES.mbackup=()=>{const c=DB.masterCfg||{};return `<div class="head"><h1>Backup</h1></div><div class="card"><h3>Full backup (all schools &amp; accounts)</h3><p class="mute">Last online backup: <b>${c.last?new Date(c.last).toLocaleString():'never'}</b></p><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn pri" data-a="dlFull">Download full backup</button><label class="btn" style="margin:0">Restore full backup<input hidden type="file" accept=".json" data-c="restoreFull"></label></div><h3 style="margin-top:20px">Online backup (Google Drive)</h3><form data-s="mgd" style="display:flex;gap:8px;flex-wrap:wrap;align-items:end"><label style="flex:1;min-width:220px"><span>Google OAuth Client ID</span><input name="cid" value="${esc(c.cid||'')}" placeholder="xxxx.apps.googleusercontent.com"></label><button class="btn">Save ID</button></form><div style="margin-top:10px"><button class="btn pri" data-a="mOnline">Online Backup</button></div><p class="mute" style="font-size:12.5px">Needs a Google OAuth Client ID (Drive API on) and the app opened from an https address. The file is saved in your own Google Drive.</p></div>`};
SUB.mgd=f=>{DB.masterCfg=Object.assign(DB.masterCfg||{},{cid:f.cid.value.trim()});save();toast('Saved.','ok')};
ACT.mOnline=async()=>{if(!isM())return;const c=DB.masterCfg||{};
  if(!c.cid){toast('Save your Google Client ID first.','bad');return}
  if(location.protocol==='file:'){toast('Online backup needs the app opened from a web address (https), not a local file.','bad');return}
  try{await new Promise((res,rej)=>{if(window.google&&google.accounts)return res();const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.onload=res;s.onerror=()=>rej(new Error('Could not load Google sign-in. Check your internet.'));document.head.appendChild(s)});
    const tok=await new Promise((res,rej)=>google.accounts.oauth2.initTokenClient({client_id:c.cid,scope:'https://www.googleapis.com/auth/drive.file',callback:r=>r.error?rej(new Error(r.error)):res(r.access_token),error_callback:e=>rej(new Error(e.message||e.type))}).requestAccessToken());
    const b='sms'+Date.now(),mime='application/json',body=new Blob([`--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify({name:`sms-full-backup-${today()}.json`,mimeType:mime})}\r\n--${b}\r\nContent-Type: ${mime}\r\n\r\n`,JSON.stringify({app:'sms-full',DB}),`\r\n--${b}--`]);
    const r=await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart',{method:'POST',headers:{Authorization:'Bearer '+tok,'Content-Type':'multipart/related; boundary='+b},body});
    if(!r.ok)throw new Error('Upload failed ('+r.status+')');
    DB.masterCfg.last=Date.now();save();render();toast('Online backup saved to your Google Drive.','ok')}catch(e){toast('Google Drive: '+e.message,'bad')}};

};

ACT.picAdd=()=>{if(isM())picDlg(null)};

<script>
/* ===== Add-on v16: Back buttons (top bar, phone back key, login) and Cancel buttons on inline forms ===== */
(function(){
const st=document.createElement('style');st.textContent=`
.backb{display:inline-flex;align-items:center;gap:6px;font-weight:600}.backb svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.lgx-back{justify-self:start;border:0;background:none;color:var(--link,#0E3B43);font:inherit;font-weight:600;cursor:pointer;padding:0 0 10px;display:flex;gap:6px;align-items:center}
.cxl{margin-left:8px}`;document.head.appendChild(st);
let stack=[],last={p:null,s:null},going=false;
const canBack=()=>!!S.user&&(!!S.ctx.thread||stack.length>0||(S.user.role==='master'&&!!S.sid));
const rn=render;
render=function(){
  if(S.user){
    if(last.p!==null&&!going&&(S.page!==last.p||S.sid!==last.s)){stack.push({p:last.p,s:last.s});if(stack.length>30)stack.shift();try{history.pushState({b:1},'')}catch(e){}}
    last={p:S.page,s:S.sid};
  }else{stack=[];last={p:null,s:null}}
  going=false;
  const r=rn.apply(this,arguments);addCancels();return r;
};
ACT.back=()=>{
  if(!S.user)return;
  if(S.ctx.thread){delete S.ctx.thread;render();return}
  const t=stack.pop();
  if(t){going=true;S.page=t.p;S.sid=t.s;S.ctx={};S.side=false;render();window.scrollTo(0,0);return}
  if(S.user.role==='master'&&S.sid&&ACT.exitSchool)ACT.exitSchool();
};
addEventListener('popstate',()=>{if(canBack())ACT.back()});
const sh=shell;
shell=function(inner){
  const h=sh(inner);if(!canBack())return h;
  const b='<button class="btn backb" data-a="back" aria-label="Back" title="Back"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>Back</button>';
  return /data-a="menu"[^>]*>[^<]*<\/button>/.test(h)?h.replace(/(data-a="menu"[^>]*>[^<]*<\/button>)/,'$1'+b):h.replace('<header class="top">','<header class="top">'+b);
};
/* login: back from Register / Forgot password */
const lv=loginView;
loginView=function(){
  const h=lv();if(S.auth==='login')return h;
  return h.replace('<div class="lgx-card">','<div class="lgx-card"><button type="button" class="lgx-back" data-a="auth" data-m="login"><span aria-hidden="true">&larr;</span> Back to sign in</button>');
};
/* Cancel on inline forms */
const CF=['chpw','chpw8','chun','chuser','accDel','lkSet','saveSettings','stSave','tsSave','npSave','aiSave','saveAtt','saveTatt'];
function addCancels(){
  CF.forEach(k=>document.querySelectorAll(`form[data-s="${k}"]`).forEach(f=>{
    if(f.querySelector('[data-cancel]'))return;
    const sb=[...f.querySelectorAll('button')].filter(b=>b.type!=='button'&&!b.dataset.cancel).pop();if(!sb)return;
    const c=document.createElement('button');c.type='button';c.className='btn cxl';c.dataset.cancel='1';c.textContent='Cancel';
    sb.insertAdjacentElement('afterend',c);
  }));
}
document.addEventListener('click',e=>{
  const c=e.target.closest('[data-cancel]');if(!c)return;
  const f=c.closest('form');if(f)f.reset();
  if(S.page==='profile'&&stack.length)ACT.back();
});
})();
</script>

  html body .ov:not(.doc):not(.drw):not(.pal){align-items:flex-end;padding:0}
  html body .ov:not(.doc):not(.drw):not(.pal) .modal{max-width:none;width:100%;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding-bottom:env(safe-area-inset-bottom,0px);animation:sheetUp .22s cubic-bezier(.2,.8,.2,1)}

}
@keyframes sheetUp{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){html body .modal{animation:none!important}}
@media print{.bnav{display:none!important}html body .ov.doc .sheet{box-shadow:none!important;border-radius:0!important}}
`;
const el=document.createElement('style');el.id='shell-ui';el.textContent=css;document.head.appendChild(el);

/* label table cells with their column heading so phones can show each row as a card */
const mq=window.matchMedia('(max-width:860px)');
let busy=false;
function label(){
  if(busy)return;busy=true;
  try{
    document.querySelectorAll('.content .tw').forEach(w=>{
      const t=w.querySelector('table');
      if(!t||t.closest('.sheet')||!t.tHead||!t.tBodies.length)return;
      const heads=[...t.tHead.rows[t.tHead.rows.length-1].cells].map(c=>c.textContent.trim());
      const rows=[...t.tBodies[0].rows];
      if(!rows.length||rows.some(r=>[...r.cells].some(c=>c.colSpan>1))||t.querySelector('input,select')){w.classList.remove('mcards');return}
      rows.forEach(r=>[...r.cells].forEach((c,i)=>{if(heads[i]!==undefined&&c.getAttribute('data-label')!==heads[i])c.setAttribute('data-label',heads[i])}));
      w.classList.toggle('mcards',mq.matches);
    });
  }finally{busy=false}
}
let tm;const later=()=>{clearTimeout(tm);tm=setTimeout(label,40)};
new MutationObserver(later).observe(document.body,{childList:true,subtree:true});
(mq.addEventListener?mq.addEventListener('change',later):mq.addListener(later));
later();
})();
</script>

/* ---- one-time update of stored data: new About text, developer picture, Help Facebook link ---- */
function migrate16(){
  if(typeof DB==='undefined'||!DB||!DB.users||DB.v16)return;
  if(DB.help&&/@IUCSMaster/i.test(DB.help.fb||''))DB.help.fb='https://www.facebook.com/iucsmaster';
  delete DB.about;delete DB.aboutDeleted;
  DB.aboutPics=(DB.aboutPics||[]).filter(p=>p.id!=='dev-default');
  DB.aboutPics.unshift({id:'dev-default',img:DEV_IMG,text:DEV_TEXT,anim:'zoom',tanim:'up'});
  DB.v16=1;save();
}
const r16=render;
render=function(){
  if(typeof DB!=='undefined'&&DB&&DB.users){migrate16();const m=master();LOGO=(m&&m.logo)||LOGO0}
  return r16.apply(this,arguments);
};

/* ---- School admins: full details, edit, disable/enable, reset password ---- */
PAGES.madmins=()=>{
  const L=DB.users.filter(u=>u.role==='admin');
  return `<div class="head"><h1>School admins</h1></div><div class="card flush">${L.length?`<div class="tw"><table><thead><tr><th>Name</th><th>Username</th><th>School</th><th>Phone</th><th>Status</th><th></th></tr></thead><tbody>${L.map(u=>{const s=DB.schools.find(x=>x.id===u.sid)||{};return `<tr><td><button class="lnk" data-a="admView" data-id="${u.id}"><b>${esc(u.name)}</b></button></td><td>${esc(u.username)}</td><td>${esc(s.name)}</td><td>${esc(u.phone)}</td><td>${u.active===false?tag('Disabled','bad'):tag('Active','ok')}</td><td class="acts"><button class="lnk" data-a="admView" data-id="${u.id}">View / Edit</button><button class="lnk" data-a="resetPw" data-id="${u.id}">Reset password</button><button class="lnk" data-a="admTog" data-id="${u.id}">${u.active===false?'Enable':'Disable'}</button></td></tr>`}).join('')}</tbody></table></div>`:'<div class="empty"><b>No school admins yet</b></div>'}</div>`;
};
ACT.admTog=async(d,el)=>{
  if(!isM())return;const u=DB.users.find(x=>x.id===d.id&&x.role==='admin');if(!u)return;
  const off=u.active!==false;
  if(off&&!await ask('Disable the account of '+u.name+'? This admin will not be able to sign in.','Disable'))return;
  u.active=!off;save();const ov=el&&el.closest&&el.closest('.ov');if(ov)ov.remove();render();toast(off?'Account disabled.':'Account enabled.','ok');
};
ACT.togUser=ACT.admTog;
ACT.admOpen=(d,el)=>{const ov=el.closest('.ov');if(ov)ov.remove();ACT.openSchool({id:d.id})};
ACT.admView=d=>{
  if(!isM())return;const u=DB.users.find(x=>x.id===d.id&&x.role==='admin');if(!u)return;
  const s=DB.schools.find(x=>x.id===u.sid)||{};
  const act=c=>DB.c[c].filter(r=>r.sid===s.id&&r.status==='Active').length;
  const inp=(n,l,v,t='text',x='')=>`<label><span>${l}</span><input name="${n}" type="${t}" value="${esc(v||'')}" ${x}></label>`;
  openModal({title:'School admin details',wide:true,saveLabel:'Save changes',
    html:`<div class="adm-act"><button type="button" class="btn sm" data-a="resetPw" data-id="${u.id}">Reset password</button><button type="button" class="btn sm ${u.active===false?'pri':'bad'}" data-a="admTog" data-id="${u.id}">${u.active===false?'Enable account':'Disable account'}</button>${s.id?`<button type="button" class="btn sm" data-a="admOpen" data-id="${s.id}">Open school</button>`:''}</div>
    <div class="adm-det"><div class="two"><div>${led('Status',u.active===false?'Disabled':'Active')}${led('Role','School Admin')}${led('Password',esc(u.initPw||'Not saved - use Reset password'))}${led('Registration ID',esc(s.regId||''))}</div><div>${led('School status',s.active===false?'Suspended':'Active')}${led('Active students',s.id?num(act('students')):'0')}${led('Active teachers',s.id?num(act('teachers')):'0')}</div></div></div>
    <form class="grid">${inp('name','Admin full name',u.name,'text','required')}${inp('un','Username',u.username,'text','required minlength="3" autocomplete="off"')}${inp('ph','Admin phone',u.phone,'tel')}${inp('em','Admin email',u.email||s.email,'email')}${inp('sn','School name',s.name,'text','required')}${inp('sa','School address',s.address)}${inp('sp','School phone',s.phone,'tel')}${inp('se','School email',s.email,'email')}</form>`,
    save:(close,el)=>{
      if(!isM())return;const f=el.querySelector('form');if(!f.reportValidity())return;
      const un=f.un.value.trim();
      if(/\s/.test(un)){toast('Username cannot contain spaces.','bad');return}
      if(DB.users.some(x=>x!==u&&String(x.username||'').toLowerCase()===un.toLowerCase())){toast('That username is already taken.','bad');return}
      u.name=f.name.value.trim();u.username=un;u.phone=f.ph.value.trim();u.email=f.em.value.trim();
      if(s.id){s.name=f.sn.value.trim();s.address=f.sa.value.trim();s.phone=f.sp.value.trim();s.email=f.se.value.trim()}
      save();close();render();toast('School admin updated.','ok');
    }});
};

/* ---- My account (master): logo ---- */
const pf16=PAGES.profile;
PAGES.profile=function(){
  const h=pf16.apply(this,arguments);if(!isM())return h;const m=master();
  return h+`<div style="height:16px"></div><div class="card" style="max-width:520px;display:grid;gap:12px"><h3 style="margin:0">Logo</h3><div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap"><div class="mlogo"><img src="${LOGO}" alt="Logo"></div><div style="display:flex;gap:8px;flex-wrap:wrap"><label class="btn" style="margin:0">Change logo<input hidden type="file" accept="image/*" data-c="mLogo"></label>${m&&m.logo?'<button class="btn" data-a="mLogoReset">Use default logo</button>':''}</div></div><p class="mute" style="margin:0;font-size:12.5px">The logo is shown on the sign-in page and in the menu.</p></div>`;
};
const fit=f=>new Promise(r=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,320/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));c.getContext('2d').drawImage(im,0,0,c.width,c.height);r(c.toDataURL('image/png'))};im.onerror=()=>r(null);im.src=fr.result};fr.onerror=()=>r(null);fr.readAsDataURL(f)});
INP.mLogo=async(v,el)=>{if(!isM())return;const f=el.files[0];if(!f)return;const d=await fit(f);if(!d){toast('Could not read that picture.','bad');return}const m=master();m.logo=d;save();render();toast('Logo changed.','ok')};
ACT.mLogoReset=()=>{if(!isM())return;const m=master();delete m.logo;save();render();toast('Default logo restored.','ok')};

/* ---- Master recovery: forgot username / password, confirmation code to saved email or phone ---- */
const mask=e=>e.replace(/^(.{2})[^@]*(@.*)$/,'$1***$2');
ACT.mRecover=()=>{
  openModal({title:'Master Admin recovery',saveLabel:'Send code',
    html:'<p style="margin-top:0">Enter the email address or phone number saved in My account. A 6-digit confirmation code will be sent.</p><form><label><span>Email address or phone number</span><input name="d" required autocomplete="off"></label></form>',
    save:(close,el)=>{
      const m=master(),v=el.querySelector('input[name=d]').value.trim();if(!m||!v)return;
      const isE=v.includes('@'),p=dg(v);
      const ok=isE?String(m.email||'').trim().toLowerCase()===v.toLowerCase():(p.length>=9&&String(m.phone||'').split('/').some(x=>{const q=dg(x);return q&&(q===p||q.endsWith(p)||p.endsWith(q))}));
      if(!ok){toast('That email address or phone number does not match the Master Admin account.','bad');return}
      close();recStep(m,isE);
    }});
};
async function recStep(m,viaEmail){
  const gen=()=>String(100000+crypto.getRandomValues(new Uint32Array(1))[0]%900000);
  let code=gen(),exp=Date.now()+600000,tries=0,sent=false;
  const to=viaEmail?(m.email||''):'';
  const issue=async()=>{code=gen();exp=Date.now()+600000;tries=0;sent=viaEmail&&window.__sendMasterMail?await window.__sendMasterMail(to,code):false};
  sent=viaEmail&&window.__sendMasterMail?await window.__sendMasterMail(to,code):false;
  const demo=()=>sent?'':`<div class="mdemo"><b>Demo mode:</b> no ${viaEmail?'email':'SMS'} gateway is connected, so your code is <b>${code}</b></div>`;
  const mo=openModal({title:'Confirmation code',saveLabel:'Recover account',
    html:`<p style="margin-top:0">${sent?`A 6-digit code was sent to <b>${esc(mask(to))}</b>.`:'A 6-digit code was prepared.'} It is valid for 10 minutes.</p><div id="rdemo">${demo()}</div><form class="grid"><label class="full"><span>Confirmation code</span><input name="c" inputmode="numeric" maxlength="6" required autocomplete="one-time-code"></label><label class="full"><span>New username (leave empty to keep the current one)</span><input name="u" autocomplete="off"></label><label class="full"><span>New password (at least 8 characters)</span><input name="p" type="password" minlength="8" required autocomplete="new-password"></label><label class="full"><span>Confirm new password</span><input name="p2" type="password" minlength="8" required autocomplete="new-password"></label></form><p style="margin-bottom:0"><a href="#" data-rs="1">Send a new code</a></p>`,
    save:(close,el)=>{
      const f=el.querySelector('form');if(!f.reportValidity())return;
      if(Date.now()>exp){toast('This code has expired. Send a new code.','bad');return}
      if(f.c.value.trim()!==code){tries++;if(tries>=3){close();toast('Too many wrong codes. Start again.','bad');return}toast('Wrong code. '+(3-tries)+' tries left.','bad');return}
      if(f.p.value!==f.p2.value){toast('Passwords do not match.','bad');return}

<script>
/* ===== Refresh button: reloads saved data and redraws the current page ===== */
(function(){
  let busy=false,last=null;
  const ICON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>';
  const hm=d=>d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  const button=()=>{const tip=last?'Refresh data (last updated '+hm(last)+')':'Refresh data';
    return `<button type="button" class="rf-btn${busy?' busy':''}" data-a="refresh" title="${tip}" aria-label="Refresh data"${busy?' aria-busy="true"':''}>${ICON}<span class="rf-t">${busy?'Refreshing':'Refresh'}</span></button>`};
  const _sh=shell;
  shell=function(inner){
    const h=_sh(inner);
    return h.replace(/<header class="top">[\s\S]*?<\/header>/,m=>m.replace('<span class="sp"></span>',()=>'<span class="sp"></span>'+button()));
  };
  const readRaw=async()=>{
    try{if(window.storage){const r=await window.storage.get('sms-db');return r&&r.value}
      if(typeof localStorage!=='undefined')return localStorage.getItem('sms-db')}catch(e){}
    return null};
  const writeNow=async()=>{
    clearTimeout(_t);const s=JSON.stringify(DB);
    try{if(window.storage)await window.storage.set('sms-db',s);else if(typeof localStorage!=='undefined')localStorage.setItem('sms-db',s)}catch(e){}};
  ACT.refresh=async()=>{
    if(busy||!S.user)return;busy=true;
    const b=document.querySelector('.rf-btn');if(b){b.classList.add('busy');const t=b.querySelector('.rf-t');if(t)t.textContent='Refreshing'}
    const t0=Date.now(),uid0=S.user.id;let ok=true;
    try{
      await writeNow();                       /* nothing typed is lost */
      const raw=await readRaw();
      if(raw){JSON.parse(raw);await load();   /* parse first, so a bad read never wipes the screen */
        const u=DB.users.find(x=>x.id===uid0);

    }catch(e){ok=false;console.error(e)}

    busy=false;last=new Date();
    const nb=document.querySelector('.rf-btn');if(nb){nb.classList.remove('busy');nb.removeAttribute('aria-busy');nb.title='Refresh data (last updated '+hm(last)+')';const t=nb.querySelector('.rf-t');if(t)t.textContent='Refresh'}
    toast(ok?'Data refreshed. '+hm(last):'Could not refresh. Please try again.',ok?'ok':'bad');
  };
})();
</script>

PAGES.subjects=()=>{

  const names=subjectNames();
  const has=n=>rows('subjects').some(x=>x.classId===cur&&String(x.name||'').toLowerCase()===n.toLowerCase());
  const show=ed?names:names.filter(has);
  const nOn=names.filter(has).length;
  let body;
  if(!show.length)body=`<div class="empty"><b>No subjects</b>${ed?'Use “Add subject” to create subjects, then switch them on for this class.':'No subjects are set for this class yet.'}</div>`;
  else body=`<div class="sx-grid">${show.map(n=>{
    const on=has(n);
    return `<div class="sx-tile ${on?'on':''}" style="--h:${hueOf(n)}"><span class="sx-ic">${esc(n.trim().charAt(0).toUpperCase())}</span><span class="sx-nm" title="${esc(n)}">${esc(n)}</span><span class="sx-tools">${can('subjects','edit')?`<button type="button" class="lnk" data-a="subEdit" data-n="${esc(n)}" title="Edit">Edit</button>`:''}${can('subjects','delete')?`<button type="button" class="lnk bad" data-a="subDel" data-n="${esc(n)}" title="Delete">Del</button>`:''}</span><label class="sx-sw"><input type="checkbox" data-c="subTick" data-n="${esc(n)}" ${on?'checked':''} ${ed?'':'disabled'} aria-label="${esc(n)}"><i></i></label></div>`}).join('')}</div>`;
  const pctOn=names.length?Math.round(nOn/names.length*100):0;
  const bar=`<div class="sx-bar"><div><h3>${esc(refText('classes',cur))}</h3><p>${nOn} subject${nOn===1?'':'s'} in this class${ed?` (out of ${names.length})`:''}</p>${ed?`<div class="sx-prog"><i style="width:${pctOn}%"></i></div>`:''}</div>${ed&&names.length?'<div style="display:flex;gap:8px"><button type="button" class="btn sm" data-a="subAll" data-v="1">Select all</button><button type="button" class="btn sm" data-a="subAll" data-v="0">Clear all</button></div>':''}</div>`;
  return head+chips+`<div class="card flush" id="subbody">${bar}${body}</div>`;
};
ACT.subCls=d=>{S.ctx.subClass=d.id;render()};
ACT.subAll=async d=>{
  if(!subjEdit())return;const c=subjCur();if(!c)return;
  if(d.v==='1'){subjectNames().forEach(n=>{if(!rows('subjects').some(x=>x.classId===c&&String(x.name||'').toLowerCase()===n.toLowerCase()))DB.c.subjects.push({id:uid(),sid:S.sid,ts:Date.now(),name:n,classId:c})})}
  else{
    const ids=rows('subjects').filter(x=>x.classId===c).map(x=>x.id);if(!ids.length)return;

  }

};

<script id="att-v4-js">
(function(){
const C={P:'#1FA855',A:'#D64545',L:'#E8A317',V:'#2B7DE9'};
function pills(id,cur){return ST.map(([k,n])=>`<label class="${k}"><input type="radio" name="s_${id}" value="${k}" ${k===cur?'checked':''}><span>${n}</span></label>`).join('')}
function ui(items,rec,sub,ed,date,who){
 const body=items.map(x=>{const cur=(rec&&rec.marks[x.id])||'P',ini=esc((x.name||'?').trim().charAt(0).toUpperCase());
  return `<div class="arow" data-n="${esc((x.name+' '+(x.sub||'')+' '+(x.roll||'')).toLowerCase())}"><div class="aav">${ini}</div>${x.roll!==undefined?`<div class="rl">#${esc(x.roll||'-')}</div>`:''}<div class="anm"><b>${esc(x.name)}</b><small>${esc(x.sub||'')}</small></div><div class="aps">${ed?pills(x.id,cur):(rec&&rec.marks[x.id]?tag(ST.find(s=>s[0]===rec.marks[x.id])[1],rec.marks[x.id]==='A'?'bad':'ok'):'<span class="mute">Not marked</span>')}</div></div>`}).join('');
 const k=(l,key)=>`<div class="k" style="--c:${C[key]}"><span>${l}</span><b data-k="${key}">0</b></div>`;
 return `<div class="ast"><div class="rw"><div class="ring" id="atRing"><b id="atPct">0%</b></div><div><b>${who} attendance</b><small>${esc(fmtD(date))}</small><small id="atTot"></small></div></div>${k('Present','P')}${k('Absent','A')}${k('Late','L')}${k('Leave','V')}</div>
 <div class="card flush"><form class="attf" data-s="${sub}"><div class="atb"><div class="sq"><input data-i="attQ" placeholder="Search ${who.toLowerCase()}..." aria-label="Search"></div>${ed?'<button type="button" class="b" data-a="attAll" data-v="P">✔ All Present</button><button type="button" class="b" data-a="attAll" data-v="A">✖ All Absent</button>':''}</div><div>${body}</div>${ed?`<div class="asv"><span class="mute">Choose a status for each ${who==='Students'?'student':'teacher'}, then save.</span><button class="btn pri">💾 Save Attendance</button></div>`:''}</form></div>`;
}
function rest(html){const t=document.createElement('div');t.innerHTML=html;const h=t.querySelector('.head'),c=t.querySelector('.card.flush');if(h)h.remove();if(c)c.remove();return t.innerHTML}
function hd(title,tools){return `<div class="head"><h1>${title}</h1><div class="tools">${tools}</div></div>`}
const a0=PAGES.attendance,t0=PAGES.tattendance;
PAGES.attendance=function(){
 if(S.user.role==='student')return a0();
 const c=S.ctx.attClass||'',d=S.ctx.attDate||today(),ed=can('attendance','create')||can('attendance','edit');
 const rec=rows('att').find(x=>x.date===d&&x.classId===c);
 const L=c?activeStudents().filter(s=>s.classId===c).sort((a,b)=>(+a.rollNo||0)-(+b.rollNo||0)||a.name.localeCompare(b.name)).map(s=>({id:s.id,name:s.name,sub:s.regNo,roll:s.rollNo})):[];
 const tools=`<select data-c="attC" aria-label="Class"><option value="">Choose class</option>${opts({t:'ref',ref:'classes'}).map(([x,y])=>`<option value="${x}" ${x===c?'selected':''}>${esc(y)}</option>`).join('')}</select><input type="date" data-c="attD" value="${d}" style="width:auto" aria-label="Date">`;
 const main=!c?'<div class="card"><div class="empty"><b>Choose a class</b>Pick a class and date to mark attendance.</div></div>':!L.length?'<div class="card"><div class="empty"><b>No active students</b>This class has no active students.</div></div>':ui(L,rec,'saveAtt',ed,d,'Students');
 return hd('Student attendance',tools)+main+rest(a0());
};
PAGES.tattendance=function(){
 const d=S.ctx.tD||today(),rec=rows('tatt').find(x=>x.date===d),ed=can('tattendance','create')||can('tattendance','edit');
 const L=rows('teachers').filter(t=>t.status==='Active').map(t=>({id:t.id,name:t.name,sub:t.tNo}));
 const main=!L.length?'<div class="card"><div class="empty"><b>No active teachers</b>Admit a teacher first.</div></div>':ui(L,rec,'saveTatt',ed,d,'Teachers');
 return hd('Teacher attendance',`<input type="date" data-c="tD" value="${d}" style="width:auto" aria-label="Date">`)+main+rest(t0());
};
function upd(){const f=document.querySelector('.attf');if(!f)return;const n={P:0,A:0,L:0,V:0};f.querySelectorAll('input[type=radio]:checked').forEach(i=>n[i.value]++);
 const t=n.P+n.A+n.L+n.V;document.querySelectorAll('.ast .k b').forEach(b=>b.textContent=n[b.dataset.k]);
 const pc=t?Math.round((n.P+n.L)/t*100):0,r=document.getElementById('atRing');if(r)r.style.setProperty('--p',pc);
 const e=document.getElementById('atPct');if(e)e.textContent=pc+'%';const o=document.getElementById('atTot');if(o)o.textContent=t+' total'}
document.addEventListener('change',e=>{if(e.target.closest('.attf'))upd()});
ACT.attAll=d=>{document.querySelectorAll('.attf .arow:not([hidden]) input[value="'+d.v+'"]').forEach(i=>i.checked=true);upd()};
INP.attQ=v=>{v=v.toLowerCase();document.querySelectorAll('.attf .arow').forEach(r=>r.hidden=!!v&&!r.dataset.n.includes(v))};
const r0=render;render=function(){const x=r0.apply(this,arguments);setTimeout(upd,0);return x};setTimeout(upd,0);
})();
</script>

<script id="sch-v5-js">
(function(){
const PAL=[['#2B7DE9','#E8F1FD'],['#1FA855','#E4F6EB'],['#E8830F','#FFF0DC'],['#8B5CD6','#F0E9FB'],['#D64545','#FDEAEA'],['#0E9AA7','#DFF4F6'],['#C2410C','#FFEDE3'],['#B8860B','#FBF2D5']];
const col=id=>{let h=0;String(id||'').split('').forEach(c=>h=(h*31+c.charCodeAt(0))>>>0);return PAL[h%PAL.length]};
const tm=(a,b)=>[a,b].filter(Boolean).join(' - ');
const MN=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'],MF=['January','February','March','April','May','June','July','August','September','October','November','December'];
const ibtn=(k,id,cE,cD)=>(cE?`<button data-a="edit" data-k="${k}" data-id="${id}" title="Edit">✏️</button>`:'')+(cD?`<button data-a="del" data-k="${k}" data-id="${id}" title="Delete">🗑</button>`:'');
/* ---- Class timetable ---- */
PAGES.timetable=function(){
 const all=scope('timetable',rows('timetable')),cls=rows('classes').filter(c=>all.some(r=>r.classId===c.id));
 let c=S.f.timetable;if(!c||!cls.some(x=>x.id===c))c=(cls[0]||{}).id||'';S.f.timetable=c;
 const L=all.filter(r=>r.classId===c),days=DAYS.filter(d=>L.some(r=>r.day===d)),per=[...new Set(L.map(r=>+r.period))].sort((a,b)=>a-b);
 const today_=new Date().toLocaleDateString('en-US',{weekday:'long'}),cE=can('timetable','edit'),cD=can('timetable','delete');
 const sel=S.user.role!=='student'?`<select data-c="ttC" aria-label="Class">${rows('classes').map(x=>`<option value="${x.id}" ${x.id===c?'selected':''}>${esc(x.name)}</option>`).join('')}</select>`:'';
 const add=can('timetable','create')?'<button class="btn pri" data-a="add" data-k="timetable">＋ Add Period</button>':'';
 let g='<div class="empty"><b>No timetable yet</b>Add periods to build the weekly timetable.</div>';
 if(L.length){g=`<div class="tgw"><div class="tg" style="grid-template-columns:70px repeat(${days.length},minmax(140px,1fr))"><div class="tgh">Period</div>${days.map(d=>`<div class="tgh ${d===today_?'tgt':''}">${d}${d===today_?' • Today':''}</div>`).join('')}${per.map(p=>`<div class="tgp">${p}</div>`+days.map(d=>`<div class="${d===today_?'tgc':''}">${L.filter(r=>r.day===d&&+r.period===p).map(r=>{const [a,b]=col(r.subjectId);return `<div class="sc" style="--c:${a};--bg:${b}"><b>${esc(refText('subjects',r.subjectId))}</b><small class="tm">${esc(tm(r.start,r.end))}</small><small>${r.teacherId?esc(refText('teachers',r.teacherId)):''}</small><div class="ac">${ibtn('timetable',r.id,cE,cD)}</div></div>`}).join('')}</div>`).join('')).join('')}</div></div>`}
 return `<div class="head"><h1>Class timetable</h1><div class="tools">${sel}${add}</div></div><div class="sts"><div style="--c:#2B7DE9"><span>Periods</span><b>${L.length}</b></div><div style="--c:#1FA855"><span>Days</span><b>${days.length}</b></div><div style="--c:#E8830F"><span>Subjects</span><b>${new Set(L.map(r=>r.subjectId)).size}</b></div></div>${g}`;
};
INP.ttC=v=>{S.f.timetable=v;render()};
/* ---- Year schedule ---- */
const TC={'Term start':['#2B7DE9','#E8F1FD'],'Term end':['#0E9AA7','#DFF4F6'],Holiday:['#1FA855','#E4F6EB'],Exam:['#D64545','#FDEAEA'],Event:['#8B5CD6','#F0E9FB'],Meeting:['#E8830F','#FFF0DC'],Other:['#667','#EEF0F1']};
PAGES.schedule=function(){
 const Y=+(S.ctx.yrY||new Date().getFullYear()),T=S.ctx.yrT||'All',now=today(),cE=can('schedule','edit'),cD=can('schedule','delete');
 const yr=rows('schedule').filter(e=>(e.startDate||'').startsWith(String(Y))).sort((a,b)=>a.startDate.localeCompare(b.startDate));
 const L=yr.filter(e=>T==='All'||e.type===T),n=t=>yr.filter(e=>e.type===t).length;
 const up=yr.filter(e=>(e.endDate||e.startDate)>=now).length;
 const stat=(l,v,c)=>`<div style="--c:${c}"><span>${l}</span><b>${v}</b></div>`;
 let out='',lm=-1;
 L.forEach(e=>{const [y,m,d]=e.startDate.split('-'),mi=+m-1,[c,bg]=TC[e.type]||TC.Other,end=e.endDate||e.startDate,past=end<now;
  if(mi!==lm){out+=`<div class="evm">${MF[mi]} ${y}</div>`;lm=mi}
  const df=Math.round((new Date(e.startDate+'T00:00:00')-new Date(now+'T00:00:00'))/864e5);
  const bd=now>=e.startDate&&now<=end?'Ongoing':df>0?`In ${df} day${df>1?'s':''}`:'Ended';
  out+=`<div class="evc ${past?'past':''}" style="--c:${c};--bg:${bg}"><div class="evd"><span>${MN[mi]}</span><b>${+d}</b></div><div class="bd"><h3>${esc(e.title)}</h3><div class="mt">${esc(fmtD(e.startDate))}${e.endDate&&e.endDate!==e.startDate?' → '+esc(fmtD(e.endDate)):''}${e.note?' · '+esc(String(e.note).slice(0,90)):''}</div></div><span class="evb">${esc(e.type)}</span><span class="evb" style="--c:#555;--bg:#F1F3F4">${bd}</span><div class="ac">${ibtn('schedule',e.id,cE,cD)}</div></div>`});
 const chips=['All',...Object.keys(TC)].map(x=>`<button class="${x===T?'on':''}" data-a="yrT" data-t="${x}">${x}</button>`).join('');
 return `<div class="head"><h1>Year schedule</h1><div class="tools"><button class="btn" data-a="yrY" data-d="-1">‹</button><b style="min-width:52px;text-align:center">${Y}</b><button class="btn" data-a="yrY" data-d="1">›</button>${can('schedule','create')?'<button class="btn pri" data-a="add" data-k="schedule">＋ Add Event</button>':''}</div></div>
 <div class="sts">${stat('Total events',yr.length,'#2B7DE9')}${stat('Upcoming',up,'#E8830F')}${stat('Holidays',n('Holiday'),'#1FA855')}${stat('Exams',n('Exam'),'#D64545')}</div><div class="fch">${chips}</div>${out||'<div class="card"><div class="empty"><b>No events</b>Nothing scheduled for this filter.</div></div>'}`;
};
ACT.yrT=d=>{S.ctx.yrT=d.t;render()};ACT.yrY=d=>{S.ctx.yrY=(+(S.ctx.yrY||new Date().getFullYear()))+(+d.d);render()};
/* ---- Exam timetable ---- */
const examNames=()=>{const e=cfg().exams,b=e&&e.length?e:['1st Terms Examination','2nd Terms Examination','Annual Examination'];return [...new Set([...b,...rows('examtt').map(r=>r.exam).filter(Boolean)])]};
PAGES.examtt=function(){
 const ex=examNames(),cur=ex.includes(S.ctx.exam)?S.ctx.exam:ex[0];S.ctx.exam=cur;
 const cf=S.f.examtt||'',stf=S.user.role!=='student',cE=can('examtt','edit'),cD=can('examtt','delete'),now=today();
 const L=scope('examtt',rows('examtt')).filter(r=>r.exam===cur&&(!cf||r.classId===cf));
 const dn=d=>d?new Date(d+'T00:00:00').toLocaleDateString('en-GB',{weekday:'long'}):'';
 const nxt=L.filter(r=>r.date>=now).sort((a,b)=>a.date.localeCompare(b.date))[0];
 const cards=rows('classes').filter(c=>L.some(r=>r.classId===c.id)).sort((a,b)=>a.name.localeCompare(b.name)).map(c=>{
  const R=L.filter(r=>r.classId===c.id).sort((a,b)=>(a.date||'').localeCompare(b.date||'')||(a.start||'').localeCompare(b.start||''));
  return `<div class="exc"><h3><span>🎓 ${esc(refText('classes',c.id))}</span><span>${R.length} papers</span></h3>${R.map(r=>{const [y,m,d]=(r.date||'--').split('-');return `<div class="exr"><div class="evd"><span>${MN[+m-1]||''}</span><b>${+d||''}</b></div><div class="bd"><b>${esc(refText('subjects',r.subjectId))}</b><div class="mt">${dn(r.date)} · ${esc(r.exam)}</div></div>${r.start?`<span class="pl">🕒 ${esc(r.start)}</span>`:''}${r.room?`<span class="pl">🚪 ${esc(r.room)}</span>`:''}${r.teacherId?`<span class="pl">👤 ${esc(refText('teachers',r.teacherId))}</span>`:''}${cE||cD?`<div class="ac" style="display:flex;gap:4px">${cE?`<button class="btn sm" data-a="ettEdit" data-id="${r.id}">✏️</button>`:''}${cD?`<button class="btn sm bad" data-a="del" data-k="examtt" data-id="${r.id}">🗑</button>`:''}</div>`:''}</div>`}).join('')}</div>`}).join('');
 return `<div class="head"><h1>Exam timetable</h1><div class="tools">${stf?`<select data-c="ettC" aria-label="Class"><option value="">All classes</option>${opts({t:'ref',ref:'classes'}).map(([a,b])=>`<option value="${a}" ${a===cf?'selected':''}>${esc(b)}</option>`).join('')}</select>`:''}${can('examtt','create')?'<button class="btn pri" data-a="ettAdd">＋ Add Exam Timetable</button>':''}</div></div>
 <div class="sts"><div style="--c:#D64545"><span>Papers</span><b>${L.length}</b></div><div style="--c:#2B7DE9"><span>Classes</span><b>${new Set(L.map(r=>r.classId)).size}</b></div><div style="--c:#E8830F"><span>Next paper</span><b style="font-size:16px">${nxt?esc(fmtD(nxt.date)):'—'}</b></div></div>
 <div class="fch">${ex.map(e=>`<button class="${e===cur?'on':''}" data-a="exam" data-e="${esc(e)}">${esc(e)}</button>`).join('')}${isAdm()?'<button data-a="newExam">＋ Create Exam</button>':''}</div>
 ${cards||`<div class="card"><div class="empty"><b>No timetable yet</b>${can('examtt','create')?'Click “Add Exam Timetable” to create the timetable of '+esc(cur||'this exam')+'.':'The timetable is not published yet.'}</div></div>`}`;
};
})();
</script>

<script id="hw-v6-js">
(function(){
const PAL=[['#2B7DE9','#E8F1FD'],['#1FA855','#E4F6EB'],['#E8830F','#FFF0DC'],['#8B5CD6','#F0E9FB'],['#D64545','#FDEAEA'],['#0E9AA7','#DFF4F6'],['#C2410C','#FFEDE3'],['#B8860B','#FBF2D5']];
const col=id=>{let h=0;String(id||'').split('').forEach(c=>h=(h*31+c.charCodeAt(0))>>>0);return PAL[h%PAL.length]};
const subName=id=>{const x=byId('subjects',id);return x?String(x.name||'').trim():''};
const h0=PAGES.homework;
PAGES.homework=function(){
 if(S.ctx.hwTab==='check')return h0();
 const now=today(),F=S.ctx.hwF||'All',cf=S.f.homework||'',stu=S.user.role==='student';
 const all=scope('homework',rows('homework')),L0=all.filter(h=>!cf||h.classId===cf);
 const dd=h=>Math.round((new Date(h.dueDate+'T00:00:00')-new Date(now+'T00:00:00'))/864e5);
 const L=L0.filter(h=>F==='All'||(F==='Active'&&dd(h)>=0)||(F==='Overdue'&&dd(h)<0)).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
 const chk=rows('hwcheck'),canE=can('homework','edit'),canD=can('homework','delete'),canP=can('homework','print');
 const me=stu?byId('students',S.user.ref):null;
 const card=h=>{const [c,bg]=col(h.subjectId),d=dd(h);
  const du=d<0?['bad','Overdue']:d===0?['warn','Due today']:d<=2?['warn','Due in '+d+' day'+(d>1?'s':'')]:['ok','Due in '+d+' days'];
  let pr='';
  if(stu&&me){const r=chk.find(x=>x.hwId===h.id&&x.studentId===me.id);pr=`<div class="z-hpl"><span>My status</span><b>${r?(r.done?'✅ Done':'❌ Not done'):'⏳ Not checked yet'}</b></div>`}
  else{const S_=activeStudents().filter(x=>x.classId===h.classId),dn=S_.filter(x=>chk.some(r=>r.hwId===h.id&&r.studentId===x.id&&r.done)).length,pc=S_.length?Math.round(dn/S_.length*100):0;
   pr=`<div><div class="z-hpr"><i style="width:${pc}%"></i></div><div class="z-hpl" style="margin-top:4px"><span>${dn} of ${S_.length} done</span><b>${pc}%</b></div></div>`}
  return `<article class="z-hc" style="--c:${c};--bg:${bg}"><div class="z-tp"></div><div class="z-in"><div class="z-r1"><span class="z-sb">${esc(subName(h.subjectId)||'Subject')}</span><span class="z-hdu ${du[0]}">${du[1]}</span></div><h3>${esc(h.title)}</h3><p class="z-ds">${esc(String(h.description||'').slice(0,100))||'&nbsp;'}</p><div class="z-mt"><span>🎓 <b>${esc(refText('classes',h.classId))}</b></span><span>👤 ${esc(h.by||'')}</span></div><div class="z-mt"><span>📅 Assigned <b>${esc(fmtD(h.date))}</b></span><span>⏰ Due <b>${esc(fmtD(h.dueDate))}</b></span></div>${pr}</div>${canE||canD||canP?`<div class="z-hac">${canP?`<button data-a="print" data-k="homework" data-id="${h.id}">🖨 Print</button>`:''}${canE?`<button data-a="edit" data-k="homework" data-id="${h.id}">✏️ Edit</button>`:''}${canD?`<button data-a="del" data-k="homework" data-id="${h.id}">🗑 Delete</button>`:''}</div>`:''}</article>`};
 const act=L0.filter(h=>dd(h)>=0).length,ovd=L0.length-act;
 const sts=`<div class="sts"><div style="--c:#F59E0B"><span>Total</span><b>${L0.length}</b></div><div style="--c:#1FA855"><span>Active</span><b>${act}</b></div><div style="--c:#D64545"><span>Overdue</span><b>${ovd}</b></div></div>`;
 const sel=!stu?`<select data-c="hwCls" aria-label="Class"><option value="">All classes</option>${opts({t:'ref',ref:'classes'}).map(([a,b])=>`<option value="${a}" ${a===cf?'selected':''}>${esc(b)}</option>`).join('')}</select>`:'';
 return `<div class="head"><h1>Homework</h1><div class="tools">${sel}<button class="btn z-hbtn" data-a="hwTab" data-t="check">✔ Check Homework</button>${can('homework','create')?'<button class="btn pri z-hbtn" data-a="add" data-k="homework">＋ Assign Homework</button>':''}</div></div>${sts}
 <div class="fch">${['All','Active','Overdue'].map(x=>`<button class="${x===F?'on':''}" data-a="hwF" data-t="${x}">${x}</button>`).join('')}</div>
 <div class="z-hgd">${L.map(card).join('')||'<div class="card" style="grid-column:1/-1"><div class="empty"><b>No homework found</b>Change the filter or assign new homework.</div></div>'}</div>`;
};
INP.hwCls=v=>{S.f.homework=v;render()};ACT.hwF=d=>{S.ctx.hwF=d.t;render()};
})();
</script>

<script id="fin-v7-js">
(function(){
const $m=m=>money(m);
const ini=n=>esc((n||'?').trim().charAt(0).toUpperCase());
const chips=(arr,cur,act)=>`<div class="fch">${arr.map(x=>`<button class="${x===cur?'on':''}" data-a="${act}" data-t="${x}">${x}</button>`).join('')}</div>`;
/* ================= FEES ================= */
const fst=r=>fbal(r)<=0?'Paid':(r.paid>0?'Partial':'Unpaid');
function feeRows(){
 const q=(S.ctx.feQ||'').toLowerCase(),st=S.ctx.feS||'All',cf=S.user.role==='student'?'':(S.f.fees||''),mo=S.ctx.feM||'';
 const all=scope('fees',rows('fees')).filter(r=>(!cf||(byId('students',r.studentId)||{}).classId===cf)&&(!mo||r.month===mo));
 const L=all.filter(r=>(st==='All'||fst(r)===st)&&(!q||(refText('students',r.studentId)+' '+(r.receiptNo||'')+' '+(r.type||'')).toLowerCase().includes(q)));
 return {all,L:L.sort((a,b)=>(b.ts||0)-(a.ts||0))};
}
function feeTable(){
 const {L}=feeRows(),stu=S.user.role==='student',cE=can('fees','edit'),cD=can('fees','delete'),cP=can('fees','print')||stu;
 if(!L.length)return '<div class="fz-em"><div style="font-size:38px">🧾</div><b>No fee records found</b><p>'+(stu?'No fee has been added for you yet. Please contact the school office.':'Change the filters or add a new fee.')+'</p></div>';
 return `<div class="tw" style="overflow-x:auto"><table class="fz-t"><thead><tr><th>Receipt</th><th>Student</th><th>Month / Type</th><th class="r">Net</th><th>Paid</th><th class="r">Balance</th><th>Status</th><th></th></tr></thead><tbody>${L.map(r=>{
  const n=fnet(r),pd=Number(r.paid)||0,pc=n?Math.min(100,Math.round(pd/n*100)):0,s_=fst(r),sn=refText('students',r.studentId),bal=fbal(r);
  const pay=bal>0&&(cE||(stu&&can('fees','view')));
  return `<tr><td><b>${esc(r.receiptNo||'—')}</b></td><td><div class="fz-st"><div class="fz-av">${ini(sn)}</div><div><b>${esc(sn)}</b><small>${esc(stuClass(r.studentId))}</small></div></div></td><td>${esc(fmtM(r.month))}<br><small class="mute">${esc(r.type||'')}</small></td><td class="r">${$m(n)}</td><td>${$m(pd)}<div class="fz-pb"><i style="width:${pc}%"></i></div></td><td class="r"><b style="color:${bal>0?'#B91C1C':'#15803D'}">${$m(bal)}</b></td><td><span class="fz-pill ${s_==='Paid'?'ok':s_==='Partial'?'wr':'bd'}">${s_}</span>${(r.transfers||[]).some(t=>t.status==='Pending')?'<br><small class="mute">Transfer waiting for school check</small>':''}</td><td><div class="fz-ac">${pay?`<button class="go" data-a="row" data-k="fees" data-t="pay" data-id="${r.id}">${stu?'💳 Pay online':'💵 Receive'}</button>`:''}${cP?`<button data-a="print" data-k="fees" data-id="${r.id}" title="Receipt">🖨</button>`:''}${cE?`<button data-a="edit" data-k="fees" data-id="${r.id}" title="Edit">✏️</button>`:''}${cD?`<button data-a="del" data-k="fees" data-id="${r.id}" title="Delete">🗑</button>`:''}</div></td></tr>`}).join('')}</tbody></table></div>`;
}
PAGES.fees=function(){
 const {all}=feeRows(),stu=S.user.role==='student';
 const net=all.reduce((a,r)=>a+fnet(r),0),pd=all.reduce((a,r)=>a+(Number(r.paid)||0),0),bal=net-pd,pc=net?Math.round(pd/net*100):0;

 const sel=!stu?`<select data-c="feC" aria-label="Class"><option value="">All classes</option>${opts({t:'ref',ref:'classes'}).map(([a,b])=>`<option value="${a}" ${a===cf?'selected':''}>${esc(b)}</option>`).join('')}</select>`:'';

 return `<div class="head"><h1>${stu?'My Fees':'Fees'}</h1><div class="tools">${sel}<input type="month" data-c="feM" value="${esc(mo)}" style="width:auto" aria-label="Month">${can('fees','create')?'<button class="btn hbtn" data-a="tool" data-k="fees" data-t="genFees">⚙ Generate monthly fees</button><button class="btn pri hbtn" data-a="add" data-k="fees">＋ Add Fee</button>':''}</div></div>
 <div class="sts">${k('Total fees',$m(net),'#2B7DE9')}${k('Collected',$m(pd),'#10B981')}${k('Outstanding',$m(bal),'#D64545')}${k('Collection',pc+'%','#E8A317')}</div>
 <div class="fz-bar"><div class="fz-sr"><input data-i="feQ" placeholder="Search student or receipt..." value="${esc(S.ctx.feQ||'')}"></div>${chips(['All','Paid','Partial','Unpaid'],S.ctx.feS||'All','feSt').replace('<div class="fch">','<div class="fch" style="margin:0">')}</div>
 <div class="fz-box" id="feList">${feeTable()}</div>`;
};
INP.feQ=v=>{S.ctx.feQ=v;const e=document.getElementById('feList');if(e)e.innerHTML=feeTable()};
INP.feC=v=>{S.f.fees=v;render()};INP.feM=v=>{S.ctx.feM=v;render()};ACT.feSt=d=>{S.ctx.feS=d.t;render()};
/* ================= SALARIES ================= */
function salRows(){
 const q=(S.ctx.slQ||'').toLowerCase(),st=S.ctx.slS||'All',mo=S.ctx.slM||'';

}
PAGES.salaries=function(){
 const {all}=salRows(),mo=S.ctx.slM||'';
 const net=all.reduce((a,r)=>a+(+r.net||0),0),paid=all.filter(r=>r.status==='Paid').reduce((a,r)=>a+(+r.net||0),0);
